[workspace]
resolver = "2"
members = ["crates/core", "crates/engine", "crates/cli"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
# Set by dependencies, not by this tree: `ferroday-cage` requires 1.91, and
# `ferrosys`/`pgp` require 1.88. CI builds at this floor so the claim stays true.
rust-version = "1.91"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
semver = "1"
sha2 = "0.10"
# Matches the major `gpt` exposes so its `Uuid`-typed API accepts the deterministic
# identifiers the image node derives from the lock. (The ext4 formatter takes the raw
# 16 bytes, so it imposes no version constraint of its own.)
uuid = "1"
clap = { version = "4", features = ["derive"] }
# Shell completions and the man page, both rendered from the same `clap::Command` the
# binary parses with — so neither can describe a flag the tool does not have.
clap_complete = "4"
clap_mangen = "0.3"
tempfile = "3"
boot2deb-core = { path = "crates/core" }
boot2deb-engine = { path = "crates/engine" }
