# socs/rk3288.toml — Rockchip RK3288 SoC invariants, shared across the Veyron
# Chromebook family (ten in-tree boards).
description = "Rockchip RK3288 (4x Cortex-A17, Mali-T764)"
arch        = "armv7"
dt_dir      = "rockchip"                 # arch/arm/boot/dts/<dt_dir> — same layout as arm64

# No [rkbin]. The RK3288 Chromebooks have no maskrom loader chain and no ATF/DDR
# blobs: the firmware is coreboot in the board's SPI flash. The depthcharge boot
# method reads no blob set, and resolution asks for none.

# Media modules. Both RK3288 codec blocks are mainline and neither is disabled in
# the Veyron device trees, so both inherit rk3288.dtsi's enabled default:
#   hantro_vpu     — JPEG encode, MPEG-2 / VP8 / H.264 decode
#   rockchip_vdec  — HEVC decode (the RK3288 variant of rkvdec)
modules = ["hantro_vpu", "rockchip_vdec"]

# --- What every board in the family gets --------------------------------------
# The Veyron boards differ from each other in their panel, their input, and their
# audio codec. They do not differ in how you reach a root filesystem, how you get
# on a network, or which radio is soldered to them — so those live here, once,
# and a device file states only its own deltas. `overlay/`, `overlay-pre/` and
# `overlay-nonfree/` beside this file carry the matching trees: the initramfs
# module list, the panic breadcrumb, the btsdio blacklist, the max98090 first-boot
# hook, and the two Broadcom blobs.
#
# Wi-Fi and Bluetooth. Every Veyron is a Broadcom BCM4354 combo part on this SoC:
# Wi-Fi over SDIO, Bluetooth over uart0. Debian's firmware-brcm80211 carries the
# brcmfmac4354-sdio .bin and its .clm_blob; it carries neither the board NVRAM nor
# any BCM4354 patchram, so those two are vendored in this layer's `overlay-nonfree`
# (see socs/rk3288/README.md). One copy of each serves the whole family — they
# identify the radio module, and it is the same module on every board.
#
# Only the Broadcom Veyron boards (speedy/minnie/mickey/brain) need this package
# and those blobs; the Marvell-radio boards (jerry/jaq/mighty/fievel/tiger) want
# firmware-libertas instead. It all sits here rather than per-device because every
# board this SoC layer currently serves is a Broadcom one; the day a Marvell board
# is added, the radio half of this moves down to the devices.
#
# None of it reaches a libre build: `nonfree_firmware_packages` and the
# `overlay-nonfree/` tree are exactly what a GNU Linux-libre kernel drops, which on
# this SoC costs the internal radio outright — see `kernels/rk3288-libre-7.2.toml`.
# What is left works: an AR9271 USB adapter, whose firmware is Free and packaged
# below, is the supported way onto a network there.
#
# `bluez` is what makes the Bluetooth half usable. The kernel loads the vendored
# patchram at probe whether or not anything can use it, so an image with the blob
# and no host stack is a blob loaded for nothing. It stays on a libre image, where
# the internal radio is dead: bluez is Free software, and a USB adapter that needs
# no firmware is the same answer for Bluetooth that the AR9271 is for Wi-Fi.
#
# Networking. No Veyron has an ethernet port — they are Chromebooks — so Wi-Fi is
# the only link on all of them and NetworkManager owns the interfaces, which means
# dropping the base layer's dhcpcd rather than running two things that both want to
# configure a NIC. `nmtui` is not optional in practice: joining a network is the
# first thing anyone does and everything else waits behind it. Without it the image
# offers `nmcli` and nothing else, which is a poor thing to hand someone at a bare
# console on a machine with no ethernet port. 568 KiB buys it.
#
# Which package carries `nmtui` depends on the suite. It left `network-manager` for a
# `network-manager-tui` of its own at 1.56.0-4 — forky's entry declares
# `Replaces: network-manager (<< 1.56.0-4~)`, which is that move recorded — so forky
# and sid need the separate package named and trixie (1.52.1-1) must not name it,
# because trixie's archive has no such package and its `network-manager` already
# ships the binary.
#
# alsa-utils is not a nicety on the laptops. The max98090 comes up with its DAC
# unrouted *and* its amplifiers muted, so the board is silent until both are
# cleared; this layer's `first-boot.d/20-audio` hook does that once and `alsactl`
# (from this package) persists it, replaying it on every later boot. On the
# Chromebit, which has no analog codec, it is the ordinary ALSA toolset for the
# HDMI card.
#
# firmware-ath9k-htc is the one firmware package here that is Free — it is built
# from the open-ath9k-htc-firmware sources and ships in Debian `main` — so it is
# carried on every build rather than gated with the Broadcom blobs. On a libre
# image it is the whole radio story; on any other it is 100 KB that makes an AR9271
# adapter work the moment it is plugged in, on a family of laptops with no ethernet
# port and one soldered radio.
packages = [
    "firmware-ath9k-htc",
    "network-manager",
    # Split out of `network-manager` at 1.56.0-4; trixie predates that and carries
    # `nmtui` inside `network-manager`, where naming this would fail the resolve.
    { name = "network-manager-tui", suites = ["forky", "sid"] },
    "wpasupplicant",
    "iw",
    "wireless-regdb",
    "rfkill",
    "alsa-utils",
    "bluez",
    "ca-certificates",
]

# The BCM4354's own firmware, from Debian's non-free-firmware component. Separated
# from `packages` so a libre build drops it and nothing else: see the radio note
# above, and `overlay-nonfree/` for the two blobs Debian does not carry.
nonfree_firmware_packages = ["firmware-brcm80211"]

exclude = ["dhcpcd"]

# What no build on this silicon lifts. Rendered in the support matrix and printed at
# the end of a build; the board layer adds what is true of one board rather than the
# part.
caveats = [
  "HDMI tops out at 4K30 and cannot reach 4K60: the RK3288 caps TMDS at 340 MHz, its PHY has no scrambling above that, and the VOP cannot emit YUV420, so there is no reduced-rate path either.",
]

# No [userspace] / [ffmpeg]: there is no Rockchip media-accel userspace stack for the
# RK3288 (MPP and RGA target the RK35xx family). Video decode here is the mainline
# V4L2 stateless path via Hantro/rkvdec. Resolution therefore rejects a
# `requires_media_accel` feature on this SoC, which is the correct outcome.

# What every booted Veyron image must have, checked by boot2deb-selftest.
#
# The Mali-T764 is a Midgard part driven by mainline panfrost; Midgard needs no
# firmware blob, so the GPU checks are binding and node only.
[[expect]]
check  = "driver-bound"
device = "ffa30000.gpu"
driver = "panfrost"

[[expect]]
check = "devnode"
path  = "/dev/dri/renderD128"

# The initramfs modules whose absence was each, at some point, a white screen
# that said nothing (the build asserts them at image time; this catches an
# on-device initramfs regeneration losing one). The IO-domain driver is
# `io-domain`, not `rockchip_io_domain` — the historical trap, worth checking
# by its correct name forever.
[[expect]]
check  = "initramfs-module"
module = "dw_mmc-rockchip"

[[expect]]
check  = "initramfs-module"
module = "i2c-rk3x"

[[expect]]
check  = "initramfs-module"
module = "rk808-regulator"

[[expect]]
check  = "initramfs-module"
module = "io-domain"

[[expect]]
check  = "initramfs-module"
module = "ext4"
