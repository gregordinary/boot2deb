# socs/rk3288.toml — Rockchip RK3288 SoC invariants, shared across the Veyron
# Chromebook family (ten in-tree boards).
description = "Rockchip RK3288 (4x Cortex-A17, Mali-T764)"
arch        = "armv7"
dt_dir      = "rockchip"                 # arch/arm/boot/dts/<dt_dir> — same layout as arm64

# No [rkbin]. The RK3288 Chromebooks have no maskrom loader chain and no ATF/DDR
# blobs: the firmware is coreboot in the board's SPI flash. The depthcharge boot
# method reads no blob set, and resolution asks for none.

# Media modules. Both RK3288 codec blocks are mainline and neither is disabled in
# the Veyron device trees, so both inherit rk3288.dtsi's enabled default:
#   hantro_vpu     — JPEG encode, MPEG-2 / VP8 / H.264 decode
#   rockchip_vdec  — HEVC decode (the RK3288 variant of rkvdec)
modules = ["hantro_vpu", "rockchip_vdec"]

# --- What every board in the family gets --------------------------------------
# The Veyron boards differ from each other in their panel, their input, and their
# audio codec. They do not differ in how you reach a root filesystem, how you get
# on a network, or which radio is soldered to them — so those live here, once,
# and a device file states only its own deltas. The initramfs module list is the
# `[initramfs]` table below; `overlay/`, `overlay-pre/` and `overlay-nonfree/` beside
# this file carry the matching trees: the panic breadcrumb, the btsdio blacklist, the
# max98090 first-boot hook, and the two Broadcom blobs.
#
# Wi-Fi and Bluetooth. Every Veyron is a Broadcom BCM4354 combo part on this SoC:
# Wi-Fi over SDIO, Bluetooth over uart0. Debian's firmware-brcm80211 carries the
# brcmfmac4354-sdio .bin and its .clm_blob; it carries neither the board NVRAM nor
# any BCM4354 patchram, so those two are vendored in this layer's `overlay-nonfree`
# (see socs/rk3288/README.md). One copy of each serves the whole family — they
# identify the radio module, and it is the same module on every board.
#
# Only the Broadcom Veyron boards (speedy/minnie/mickey/brain) need this package
# and those blobs; the Marvell-radio boards (jerry/jaq/mighty/fievel/tiger) want
# firmware-libertas instead. It all sits here rather than per-device because every
# board this SoC layer currently serves is a Broadcom one; the day a Marvell board
# is added, the radio half of this moves down to the devices.
#
# None of it reaches a libre build: `nonfree_firmware_packages` and the
# `overlay-nonfree/` tree are exactly what a GNU Linux-libre kernel drops, which on
# this SoC costs the internal radio outright — see `kernels/rk3288-libre-7.2.toml`.
# What is left works: an AR9271 USB adapter, whose firmware is Free and packaged
# below, is the supported way onto a network there.
#
# `bluez` is what makes the Bluetooth half usable. The kernel loads the vendored
# patchram at probe whether or not anything can use it, so an image with the blob
# and no host stack is a blob loaded for nothing. It stays on a libre image, where
# the internal radio is dead: bluez is Free software, and a USB adapter that needs
# no firmware is the same answer for Bluetooth that the AR9271 is for Wi-Fi.
#
# Networking. No Veyron has an ethernet port — they are Chromebooks — so Wi-Fi is
# the only link on all of them and NetworkManager owns the interfaces, which means
# dropping the base layer's dhcpcd rather than running two things that both want to
# configure a NIC. `nmtui` is not optional in practice: joining a network is the
# first thing anyone does and everything else waits behind it. Without it the image
# offers `nmcli` and nothing else, which is a poor thing to hand someone at a bare
# console on a machine with no ethernet port. 568 KiB buys it.
#
# Which package carries `nmtui` depends on the suite. It left `network-manager` for a
# `network-manager-tui` of its own at 1.56.0-4 — forky's entry declares
# `Replaces: network-manager (<< 1.56.0-4~)`, which is that move recorded — so forky
# and sid need the separate package named and trixie (1.52.1-1) must not name it,
# because trixie's archive has no such package and its `network-manager` already
# ships the binary.
#
# alsa-utils is not a nicety on the laptops. The max98090 comes up with its DAC
# unrouted *and* its amplifiers muted, so the board is silent until both are
# cleared; this layer's `first-boot.d/20-audio` hook does that once and `alsactl`
# (from this package) persists it, replaying it on every later boot. On the
# Chromebit, which has no analog codec, it is the ordinary ALSA toolset for the
# HDMI card.
#
# firmware-ath9k-htc is the one firmware package here that is Free — it is built
# from the open-ath9k-htc-firmware sources and ships in Debian `main` — so it is
# carried on every build rather than gated with the Broadcom blobs. On a libre
# image it is the whole radio story; on any other it is 100 KB that makes an AR9271
# adapter work the moment it is plugged in, on a family of laptops with no ethernet
# port and one soldered radio.
packages = [
    "firmware-ath9k-htc",
    "network-manager",
    # Split out of `network-manager` at 1.56.0-4; trixie predates that and carries
    # `nmtui` inside `network-manager`, where naming this would fail the resolve.
    { name = "network-manager-tui", suites = ["forky", "sid"] },
    "wpasupplicant",
    "iw",
    "wireless-regdb",
    "rfkill",
    "alsa-utils",
    "bluez",
    "ca-certificates",
]

# The BCM4354's own firmware, from Debian's non-free-firmware component. Separated
# from `packages` so a libre build drops it and nothing else: see the radio note
# above, and `overlay-nonfree/` for the two blobs Debian does not carry.
nonfree_firmware_packages = ["firmware-brcm80211"]

exclude = ["dhcpcd"]

# `audio` rides with alsa-utils above. /dev/snd/* is root:audio 0660, and logind's
# `uaccess` ACL reaches only a seated session -- which covers someone at the laptop's
# own keyboard but not one reached over SSH, and not `alsactl` restoring the mixer
# outside a session at all. On boards whose whole audio story is a codec that has to
# be unmuted at first boot, the group is what lets the operator do it without sudo.
groups = ["audio"]

# What no build on this silicon lifts. Rendered in the support matrix and printed at
# the end of a build; the board layer adds what is true of one board rather than the
# part.
caveats = [
  "HDMI tops out at 4K30 and cannot reach 4K60. The RK3288 caps TMDS at 340 MHz, and its PHY has no scrambling above that. The VOP cannot emit YUV420, so there is no reduced-rate path either.",
]

# No [userspace] / [ffmpeg]: there is no Rockchip media-accel userspace stack for the
# RK3288 (MPP and RGA target the RK35xx family). Video decode here is the mainline
# V4L2 stateless path via Hantro/rkvdec. Resolution therefore rejects a
# `requires_media_accel` feature on this SoC, which is the correct outcome.

# The Veyron initramfs. The depthcharge boot method builds it with MODULES=list, so
# this list is the whole of what reaches the root device rather than a supplement to
# what initramfs-tools picks on its own. The build writes it into a generated
# modules.d drop-in, and every name is also an `initramfs-module` selftest check,
# which catches an on-device initramfs regeneration losing one.
#
# It sits on the SoC layer because reaching a root filesystem is the same problem on
# every board in the family: the same PMIC, the same MMC controller, the same USB
# controllers. Names are the .ko basenames from the kernel's modules.order -- the
# IO-domain regulator's driver is io-domain, NOT rockchip_io_domain. initramfs-tools
# pulls each module's dependencies in on its own, so ext4 brings jbd2/crc16/crc32c
# and usbhid brings hid.
#
# NO DISPLAY STACK on a 16 MiB board -- a headroom policy, not a size limit. The DRM
# stack (rockchipdrm + analogix_dp + panel + backlight, with the DRM helpers they
# pull in) is 15 modules and about 490 KB of the initramfs. It fits under even the
# stock 16 MiB ceiling, but the kernel and the initramfs both grow from release to
# release, and the headroom is what absorbs that growth. A board at that ceiling
# therefore leaves the stack out and accepts a console that appears only after the
# real root mounts. A board whose firmware buffers 32 MiB has headroom to spend, and
# carries the stack in its own `[initramfs]` list -- see
# devices/asus-c201-libreboot.toml.
#
# Because an initramfs failure is invisible on a board without the display stack,
# three things back this list up: the build fails naming any listed module that is
# neither in the built initrd nor built into the kernel (so a typo or a module the
# kernel config dropped fails the build, not the boot); the signed cmdline carries
# panic=30 (so a failed boot visibly reboots to the splash rather than hanging on a
# white screen); and scripts/panic/boot2deb-breadcrumb writes the full dmesg to every
# reachable ext4 partition.
[initramfs]
modules = [
    # The RK808 PMIC chain. These are DEVICE-TREE dependencies, not symbol
    # dependencies, so nothing pulls them in automatically -- and without them the
    # SD slot never powers up. rk3288-veyron.dtsi feeds sdmmc from two RK808 LDOs
    # (vmmc = vcc33_sd = LDO_REG5, vqmmc = vccio_sd = LDO_REG4), so dw_mmc-rockchip
    # defers its probe until those regulators exist; in an initramfs that cannot
    # provide them the root device never appears and the boot hangs on the
    # firmware's white screen. io-domain's supplies come from the same PMIC.
    # Debian builds the rk8xx-i2c MFD core in; what it modularizes is the I2C bus
    # driver beneath it and the regulator function on top.
    "i2c-rk3x",
    "rk808-regulator",
    # The RK808's 32 kHz clock output. Consumed by the wifi power sequence
    # (sdio-pwrseq defers with "external clock not ready" without it -- observed on
    # the panel on real hardware) and cheap enough to carry rather than leave as a
    # confounder in every deferred-probe listing.
    "clk-rk808",

    # Root filesystem: ext4 on eMMC or an SD card, behind Rockchip's DesignWare MMC
    # controller. mmc_block is built in (CONFIG_MMC_BLOCK=y), so it is not listed.
    "dw_mmc",
    "dw_mmc-pltfm",
    "dw_mmc-rockchip",
    "io-domain",
    "ext4",

    # Root on USB, which this firmware also boots (Ctrl+U reads USB sticks as
    # readily as SD cards) and which is the only removable medium a Chromebit has at
    # all. The RK3288's host ports are EHCI/OHCI platform controllers behind the
    # Rockchip USB PHY; dwc2 covers the other two controllers -- and on the Chromebit
    # dwc2 is the only one there is, since rk3288-veyron-mickey.dts disables both the
    # EHCI controller and usb_host1 and leaves usb_otg in host mode. usb-storage/uas
    # present the stick, sd_mod turns it into sdN. Hardware-verified gap: an
    # initramfs without these on a USB boot enumerates eMMC and wifi happily and then
    # waits forever for a root that cannot appear.
    "phy-rockchip-usb",
    "ehci-platform",
    "ohci-platform",
    "dwc2",
    "usb-storage",
    "uas",
    "sd_mod",

    # Input for a rescue shell, which the family needs in two flavours because it has
    # two kinds of console.
    #
    # The laptops type through the ChromeOS EC, which hangs off spi0 -- so the SPI bus
    # driver has to come too: cros_ec_spi without spi-rockchip binds nothing, and a
    # rescue shell with no keyboard is indistinguishable from a hang.
    "spi-rockchip",
    "cros_ec",
    "cros_ec_spi",
    "cros_ec_keyb",
    # The Chromebit has no EC and no built-in keyboard: rk3288-veyron-mickey.dts never
    # includes rk3288-veyron-chromebook.dtsi, so spi0 stays disabled and the four
    # modules above bind nothing there. Its only input is a USB keyboard -- which is
    # also how its *firmware* reads Ctrl+U, since the Chromebit is the one board in the
    # family whose depthcharge is built with USB HID. The initramfs needs the same
    # driver to offer a shell anyone can type at. Carried on every board rather than
    # only the Chromebit, because a USB keyboard is a real fallback on a laptop whose
    # EC keyboard has failed and the two modules cost ~40 KB against megabytes of
    # spare budget.
    "usbhid",
    "hid-generic",
]

# What every booted Veyron image must have, checked by boot2deb-selftest.
#
# The Mali-T764 is a Midgard part driven by mainline panfrost; Midgard needs no
# firmware blob, so the GPU checks are binding and node only.
[[expect]]
check  = "driver-bound"
device = "ffa30000.gpu"
driver = "panfrost"

[[expect]]
check = "devnode"
path  = "/dev/dri/renderD128"
