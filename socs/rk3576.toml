# socs/rk3576.toml — RK3576 SoC invariants shared across RK3576 boards:
# arch, DT directory, force-loaded modules, and the rkbin blob defaults.
description = "Rockchip RK3576 (4x Cortex-A72 + 4x Cortex-A53, Mali-G52 MC3)"
arch        = "arm64"
dt_dir      = "rockchip"                 # arch/arm64/boot/dts/<dt_dir>

# Force-loaded modules. Empty for now: the in-tree RK3576 drivers auto-probe via
# DT compat strings, and the media-accel stack (userspace/ffmpeg) is omitted from
# this SoC layer, so nothing needs pinning at boot yet. HW decode is native
# mainline (VDPU383); a media-accel feature can add its modules later.
modules = []

# Networking + audio userspace. The H96's Wi-Fi is an AIC8800 (out-of-tree driver +
# vendored firmware, both on the device layer); these are the host-side packages that
# make it usable. NetworkManager owns the interfaces -- so the base layer's dhcpcd is
# dropped rather than running two things that both configure a NIC -- and
# `nmtui` is not optional in practice: it is how a Wi-Fi network is
# joined at a bare console, the first thing anyone does. wireless-regdb + iw +
# wpasupplicant + rfkill are the rest of the Wi-Fi stack. alsa-utils (aplay/alsamixer/
# speaker-test) drives and validates the board's analog + S/PDIF cards.
#
# No `bluez` here: it is board-specific. The AIC8800D80's Bluetooth is UART HCI, not
# the `depends on BROKEN` SDIO-BT path, and only the H96 carries the chip -- so `bluez`
# lives on devices/h96-max-m9.toml, not the SoC layer, and the rk3576-evb1-v10
# validator (no BT transport) stays free of it. These Wi-Fi/audio packages are SoC-wide;
# the evb1 inherits them benignly -- NetworkManager simply manages its Ethernet.
packages = [
    "network-manager",
    # Split out of `network-manager` at 1.56.0-4; trixie predates that and carries
    # `nmtui` inside `network-manager`, where naming this would fail the resolve.
    { name = "network-manager-tui", suites = ["forky", "sid"] },
    "wpasupplicant",
    "iw",
    "wireless-regdb",
    "rfkill",
    "alsa-utils",
]
exclude = ["dhcpcd"]

# What no build on this silicon lifts. Rendered in the support matrix and printed at
# the end of a build; the board layer adds what is true of one board rather than the
# part.
caveats = [
  "HDMI tops out at 4K30 and cannot reach 4K60: the dw-hdmi-qp bridge has no SCDC/scrambling support and rejects every mode above 340 MHz TMDS, even where the display advertises 4K60. This is upstream behaviour, not a device-tree limitation.",
  "There is no mainline hardware video encoder for this SoC. Decode is driven (VDPU383, H.264 and HEVC, 1080p and 4K); encode is not driven at all.",
  "Hardware H.264 decode fails intermittently, per decode session, and when it fails the whole session is wrong. Most sessions are bit-exact against the software decoder; roughly one in three to one in six comes out visibly corrupt instead, diverging from the first frame onward at about 17 dB PSNR. It is all-or-nothing per session, not per frame, and re-running the same file usually succeeds. HEVC is unaffected and is bit-exact against software on every run. Until this is fixed, do not rely on hardware H.264 decode; the software decoder is correct and fast enough (about 160 fps at 1080p, 40 at 4K).",
  "The NPU computes but nothing can drive it yet: the rocket userspace stack targets RK3588 only, so no RK3576 userspace exists.",
]

# rkbin defaults for RK3576 boards. The DDR loader is Rockchip's unified LP4/LP5
# blob, which also drives DDR4 boards — there is no separate DDR4 file — so it is
# the common default and boards rarely override `tpl`.
#
# No `bl32`. Mainline u-boot's binman assembles the OP-TEE FIT image with
# `fit,operation = "split-elf"` and marks the entry `optional`, so it needs an
# OP-TEE **ELF** (or a v1 `tee.bin` bearing the `OPTE\x01` header). rkbin ships
# neither for this SoC: `rk3576_bl32_*.bin` is a raw payload for Rockchip's own
# boot chain, and feeding it to binman fails with "Failed to read ELF file". The
# image binman emits without it is, in its own words, "missing optional external
# blobs but is still functional". Supplying OP-TEE means building it from
# `optee_os` and passing the resulting `tee.elf`.
[rkbin]
atf  = "rk3576_bl31_v1.24.elf"
tpl  = "rk3576_ddr_lp4_2112MHz_lp5_2736MHz_v1.12.bin"

# Media-accel source trees. The SoC declares what it has, and that set is the
# capability statement the ffmpeg build reads: librga only, so `./configure` gets
# `--enable-v4l2-request` and no Rockchip flags at all.
#
# No `[userspace.mpp]`. librockchip-mpp talks to the vendor `mpp_service` kernel
# framework, which is not mainline and is far larger a port than the RGA driver, so
# there is nothing here for MPP to bind. That also settles ffmpeg: the rkrga filters
# require `--enable-rkmpp` (they allocate frames as AVRKMPPFramesContext, and
# ffmpeg's own configure rejects the pair), so this SoC gets librga for programs
# that speak its API directly, not as an ffmpeg filter. HW decode instead comes
# from the kernel's own stateless V4L2 decoder (VDPU383, `rockchip_vdec`), which
# needs no vendor userspace.
#
# No `[userspace.libmali]`. The Mali-G52 is a Bifrost part driven by mainline
# panfrost, so its userspace is Mesa from the Debian mirror -- see the GL packages
# on devices/h96-max-m9.toml. libmali is for a CSF GPU with no mainline driver.
# librga alone: `ffmpeg_requires = ["mpp"]` is unsatisfied on this part, so the produced
# ffmpeg carries no librga `NEEDED` entry — `librga2` still ships, for programs that
# speak the API directly. That is the rule stated as data rather than as a special case
# in the ffmpeg stage.
[[userspace]]
name            = "librga"
git             = "https://github.com/tsukumijima/librga-rockchip.git"
ref             = "master"
debs            = ["librga2", "librga-dev"]
links           = ["librga2", "librga-dev"]
ffmpeg_flag     = "--enable-rkrga"
ffmpeg_requires = ["mpp"]

# The V4L2-request decode base, unmodified: no `[ffmpeg.rockchip]`, because no
# graft applies. The rk3576 patch series carry an empty `ffmpeg` scope, so the
# tree builds pristine.
[ffmpeg.base]
git = "https://code.ffmpeg.org/Kwiboo/FFmpeg.git"
ref = "v4l2-request-n8.1"

# What every booted RK3576 image must have, checked by boot2deb-selftest.
#
# The Mali-G52 is a Bifrost part driven by mainline panfrost — no firmware blob
# to check, unlike the RK3588's CSF GPU. The driver-bound check is the one that
# catches the GPU power-domain race this SoC shipped with (a probe that loses
# the race SErrors the whole boot), which the dmesg check backstops.
[[expect]]
check  = "driver-bound"
device = "27800000.gpu"
driver = "panfrost"

[[expect]]
check = "devnode"
path  = "/dev/dri/renderD128"

# The mainline stateless decoder (VDPU383, H.264 + HEVC).
[[expect]]
check = "devnode"
path  = "/dev/video0"

[[expect]]
check   = "no-dmesg-match"
pattern = "SError|Synchronous External Abort"
