# features/media-accel-rockchip.toml — the Rockchip hardware video-transcode
# stack (MPP codec + RGA 2D + ffmpeg-rk), a capability feature. It is
# named for what it *is* (a media-accel provider on Rockchip), not for any one
# app that uses it: an accelerated Jellyfin/Plex/Emby recipe, or a bare-ffmpeg
# box, all compose this same feature. Use-case bundling belongs to a recipe
# (e.g. recipes/turing-rk1/jellyfin.toml), not to this feature's name.
#
# Capability features carry a hardware compatibility gate — here `requires_soc`,
# since the stack is SoC-integrated (VEPU/VDPU/RGA). A cross-arch sibling (an
# Intel/AMD `media-accel-vaapi`, an NVIDIA `media-accel-nvenc`) would be a
# separate feature gated on `requires_arch`; the user picks the one matching
# their hardware — there is no provider auto-resolution (non-goal).
#
# An overlay tree at features/media-accel-rockchip/overlay/ is merged if present;
# this feature ships none (it adds packages only), so that directory does not
# currently exist.
description  = "Rockchip HW video transcode (MPP + RGA + ffmpeg-rk) for RK35xx"
packages     = ["ffmpeg-rk", "librockchip-mpp1", "librga2"]
# Only the SoCs whose kernel carries the vendor `mpp_service` this stack talks to,
# and only those the config tree can actually resolve — `list-features` publishes
# this list to users, so a SoC named here without a socs/<soc>.toml layer would
# advertise a configuration no device can select. Not RK3576: that part is
# mainline-only, so MPP has nothing to bind and its media-accel capability is
# provided by `media-accel-v4l2` instead.
requires_soc = ["rk3588"]
# The two providers both build an `ffmpeg-rk` deb; only one can win.
conflicts    = ["media-accel-v4l2"]

# What this feature supplies to the rest of the selection. An application feature
# that cannot function without an encoder — `jellyfin` installs none of its own and
# its server exits at startup without one — declares `requires_capability =
# ["ffmpeg"]` and is satisfied by this or by any other provider naming the same
# capability. It is a capability name rather than this feature's name so that a
# provider for another platform needs no edit to any consumer.
#
# `ffmpeg` here means the FFmpeg *binaries*, at /opt/ffmpeg-rk/bin with `-rk`-suffixed
# links in /usr/bin. It deliberately does not claim /usr/bin/ffmpeg, so a consumer
# has to be told the path; it cannot find this build by name on $PATH.
provides     = ["ffmpeg"]

# What this stack does not deliver, and the one thing it delivers only when asked
# correctly. These are properties of the `ffmpeg-rk` build, which is what this
# feature provides — so they hold in every recipe that composes it, on any RK3588
# board, and belong here rather than being restated by each.
caveats = [
  "Scaling and compositing inside a hardware transcode run on RGA, but only when the RKMPP device is named explicitly. The RGA filters (`scale_rkrga`, `vpp_rkrga`, `overlay_rkrga`) allocate their output pool from an RKMPP device. They take one from `-filter_hw_device` when the incoming frames carry a different one. A chain fed by `-hwaccel v4l2request` therefore needs `-init_hw_device rkmpp=rk -filter_hw_device rk`, and then keeps every frame in hardware from decode to encode. Without it the filters fail to configure with `No RKMPP hardware context provided`, which reads like a frame-format problem and is not one.",
  "`hwmap` does not bridge a Vulkan frame to an RKMPP one in either direction. A Vulkan filter stage must therefore round-trip through system memory before the encoder.",
  "The `h264_rkmpp`, `hevc_rkmpp`, `vp8_rkmpp` and `vp9_rkmpp` *decoders* are compiled in but fail to open. MPP finds no decode client on a mainline kernel, where `rkvdec` is a V4L2 stateless driver rather than an MPP service. Hardware decode is reached with `-hwaccel v4l2request`. The matching `*_rkmpp` encoders do work.",
  "10-bit decoded frames are `NV15`, packed 4:2:0 at four samples per five bytes. The decoder cannot be asked for `P010` instead: `rkvdec` declares `NV12`/`NV15`/`NV16`/`NV20` and no `P010`, because the hardware writes packed.",
  "Two routes consume `NV15`. RGA (`scale_rkrga`, `vpp_rkrga`, `overlay_rkrga`) converts it in hardware on the way out. `hwdownload,format=nv15` brings it to system memory, where a second `format=yuv420p10le` unpacks it in swscale. That is what lets a GPU tone mapper such as `libplacebo` see a hardware-decoded HDR frame.",
  "`hwdownload` offers only the frame's own format, so asking for `yuv420p10le` in one step leaves the graph with no viable target. `hwmap` does not substitute either: deriving a Vulkan frames context from the mapped frame fails with `Unsupported pixel format: nv15`.",
  "Vulkan cannot import `NV15` at all, because there is no VkFormat for a packed 10-bit 4:2:0 sample. A Vulkan stage always needs the swscale unpack in front of it. It must upload `yuv420p10le` rather than `p010le`, which corrupts silently.",
  "Hardware JPEG encode is `mjpeg_v4l2m2m`, and it is a different device from the H.264/HEVC encoders with different rules. It is the mainline VEPU121 on `/dev/video2` rather than MPP, so it takes system-memory frames only: `yuv420p`, `nv12`, `yuyv422` or `uyvy422`, never `drm_prime`. A hardware-decoded frame reaches it through FFmpeg's own transfer or an explicit `hwdownload,format=nv12`, not through `-filter_hw_device`.",
  "JPEG quality is `-quality 5..100`, or `-q:v` on the same scale, larger being better. Omitting both keeps the driver default of 50. That inverts the software `mjpeg` encoder, where `-q:v` is a quantizer and lower is better. A value carried over from a software command line therefore asks for the opposite quality.",
  "What the JPEG device buys is CPU rather than elapsed time. It holds a fixed 4.9 CPU-seconds per 300 1080p frames, but software `mjpeg` threads across all eight cores while this path submits serially. A batch therefore finishes slower in wall clock for about half the CPU.",
  "Two JPEG limits are the driver's, not the wrapper's. The largest frame it accepts is 8176x8176, which is 511 macroblocks in each axis and the most the hardware's nine-bit dimension registers hold. Widths are rounded up to a multiple of 4, which the encoder reports when it happens.",
  "Clamp your own JPEG input to 8176 rather than relying on the refusal. V4L2 has the driver substitute a size it can do. A larger request is honored at 8176 while ffmpeg keeps feeding the wider frame in. The result is a JPEG whose header looks right and whose picture is garbage. The encoder logs `encoder coded size is ...` first, so treat that message as an error whenever the size it reports is smaller than the one requested.",
  "AVS2 and AVS3 do not decode unless the `avs-decode` feature is composed in. The hardware has no V4L2 route to either codec, and without that feature this ffmpeg is not built with `--enable-libdavs2` or `--enable-libuavs3d`. Such a stream demuxes, because the `avs2` and `avs3` demuxers are always present, and then fails with no decoder found. The `avs` and `cavs` decoders a listing shows are a 1990s game FMV format and AVS1-P2 JiZhun respectively. Only AVS1 plays here on its own.",
  "Every `ffmpeg-rk` invocation writes `mpp_platform: client N driver is not ready!` to standard error, once per vendor service client MPP looks for and does not find on a mainline kernel. It is harmless and appears even for `ffmpeg -version`, but it is captured by anything that logs the process's stderr.",
]

# This feature's packages are built from the SoC's media-accel source trees
# (socs/<soc>.toml [userspace]/[ffmpeg]), not the Debian mirror. The flag requires
# the resolved SoC to supply those stanzas and schedules the userspace/ffmpeg
# compile nodes; a build without this feature carries no sources and skips them.
requires_media_accel = true

# The capability's own proof, checked by boot2deb-selftest wherever this feature
# is selected: the binary the whole stack exists to deliver, at the path the
# `provides = ["ffmpeg"]` contract names. This is the disk half of the historic
# no-RUNPATH failure (a binary that shipped and could not start); the build now
# asserts the RUNPATH at link time, which is strictly earlier.
[[expect]]
check = "file"
path  = "/opt/ffmpeg-rk/bin/ffmpeg"
