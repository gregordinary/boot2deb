# features/media-accel-rockchip.toml — the Rockchip hardware video-transcode
# stack (MPP codec + RGA 2D + ffmpeg-rk), a capability feature. It is
# named for what it *is* (a media-accel provider on Rockchip), not for any one
# app that uses it: an accelerated Jellyfin/Plex/Emby recipe, or a bare-ffmpeg
# box, all compose this same feature. Use-case bundling belongs to a recipe
# (e.g. recipes/turing-rk1/jellyfin.toml), not to this feature's name.
#
# Capability features carry a hardware compatibility gate — here `requires_soc`,
# since the stack is SoC-integrated (VEPU/VDPU/RGA). A cross-arch sibling (an
# Intel/AMD `media-accel-vaapi`, an NVIDIA `media-accel-nvenc`) would be a
# separate feature gated on `requires_arch`; the user picks the one matching
# their hardware — there is no provider auto-resolution (non-goal).
#
# An overlay tree at features/media-accel-rockchip/overlay/ is merged if present;
# this feature ships none (it adds packages only), so that directory does not
# currently exist.
description  = "Rockchip HW video transcode (MPP + RGA + ffmpeg-rk) for RK35xx"
packages     = ["ffmpeg-rk", "librockchip-mpp1", "librga2"]
# Only the SoCs whose kernel carries the vendor `mpp_service` this stack talks to,
# and only those the config tree can actually resolve — `list-features` publishes
# this list to users, so a SoC named here without a socs/<soc>.toml layer would
# advertise a configuration no device can select. Not RK3576: that part is
# mainline-only, so MPP has nothing to bind and its media-accel capability is
# provided by `media-accel-v4l2` instead.
requires_soc = ["rk3588"]
# The two providers both build an `ffmpeg-rk` deb; only one can win.
conflicts    = ["media-accel-v4l2"]

# What this feature supplies to the rest of the selection. An application feature
# that cannot function without an encoder — `jellyfin` installs none of its own and
# its server exits at startup without one — declares `requires_capability =
# ["ffmpeg"]` and is satisfied by this or by any other provider naming the same
# capability. It is a capability name rather than this feature's name so that a
# provider for another platform needs no edit to any consumer.
#
# `ffmpeg` here means the FFmpeg *binaries*, at /opt/ffmpeg-rk/bin with `-rk`-suffixed
# links in /usr/bin. It deliberately does not claim /usr/bin/ffmpeg, so a consumer
# has to be told the path; it cannot find this build by name on $PATH.
provides     = ["ffmpeg"]

# What this stack does not deliver. Both are properties of the `ffmpeg-rk` build,
# which is what this feature provides — so they hold in every recipe that composes
# it, on any RK3588 board, and belong here rather than being restated by each.
caveats = [
  "Scaling inside a hardware transcode runs on the CPU. The RGA filters (`scale_rkrga`, `vpp_rkrga`, `overlay_rkrga`) accept only frames carrying an RKMPP hardware context, and the mainline V4L2 decoder hands out plain DRM PRIME frames, which they reject; `hwmap` does not bridge the two either. A decode/scale/encode chain therefore downloads frames to system memory, scales them with swscale, and re-uploads them to the encoder. RGA still accelerates a scale fed from software-decoded frames, and the 2D engine itself works.",
  "The `h264_rkmpp`, `hevc_rkmpp`, `vp8_rkmpp` and `vp9_rkmpp` *decoders* are compiled in but fail to open: MPP finds no decode client on a mainline kernel, where `rkvdec` is a V4L2 stateless driver rather than an MPP service. Hardware decode is reached with `-hwaccel v4l2request`. The matching `*_rkmpp` encoders do work.",
  "10-bit content decodes in hardware, but a 10-bit transcode still converts on the CPU. The V4L2 decoder emits `NV12` for 8-bit and `NV15` — 10-bit packed 4:2:0 — for 10-bit, and no filter or encoder in this build imports `NV15`. The decoder cannot be asked for `P010` instead; the hardware writes `NV15` natively. RGA converts `NV15` to `P010`, but only for a program that speaks librga directly, since the RGA filters reject these frames as described above.",
  "Every `ffmpeg-rk` invocation writes `mpp_platform: client N driver is not ready!` to standard error, once per vendor service client MPP looks for and does not find on a mainline kernel. It is harmless and appears even for `ffmpeg -version`, but it is captured by anything that logs the process's stderr.",
]

# This feature's packages are built from the SoC's media-accel source trees
# (socs/<soc>.toml [userspace]/[ffmpeg]), not the Debian mirror. The flag requires
# the resolved SoC to supply those stanzas and schedules the userspace/ffmpeg
# compile nodes; a build without this feature carries no sources and skips them.
requires_media_accel = true

# The capability's own proof, checked by boot2deb-selftest wherever this feature
# is selected: the binary the whole stack exists to deliver, at the path the
# `provides = ["ffmpeg"]` contract names. This is the disk half of the historic
# no-RUNPATH failure (a binary that shipped and could not start); the build now
# asserts the RUNPATH at link time, which is strictly earlier.
[[expect]]
check = "file"
path  = "/opt/ffmpeg-rk/bin/ffmpeg"
