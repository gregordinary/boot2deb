# Generated by boot2deb.
#
# Take Debian's --ffmpeg= argument off jellyfin's command line, so the encoder
# path comes from /etc/jellyfin/encoding.xml instead.
#
# jellyfin-server ships JELLYFIN_FFMPEG_OPT="--ffmpeg=/usr/lib/jellyfin-ffmpeg/ffmpeg"
# in /etc/default/jellyfin and the unit passes it on ExecStart. That path belongs
# to jellyfin-ffmpeg, which this image deliberately does not install -- only the
# jellyfin metapackage depends on it, and the `jellyfin` feature names
# jellyfin-server and jellyfin-web instead. So the argument points at a binary
# that is never present.
#
# It is fatal, not a degradation. Jellyfin reads the command-line path *first*
# and only falls back to <EncoderAppPath> when it is empty, so the missing binary
# outranks any configured encoder; and a path that fails validation makes
# ApplicationHost throw FfmpegException("Failed to find valid ffmpeg"), so the
# server exits during startup rather than running without transcoding. Seeding
# encoding.xml is therefore not sufficient on its own -- see the
# `jellyfin-rockchip` feature, which seeds it.
#
# This must be a second EnvironmentFile= and not an Environment= line. systemd
# applies environment files after Environment= whatever order they appear in, so
# an Environment= here would lose to /etc/default/jellyfin; a file listed later
# wins over one listed earlier, and a drop-in is read after the unit it extends.
#
# The name sorts after the package's own jellyfin.service.conf drop-in, which
# ships a commented-out EnvironmentFile= for admins to uncomment.
[Service]
EnvironmentFile=/etc/default/jellyfin-encoder
