# features/vulkan.toml — the GPU userspace: a Vulkan loader and Mesa's drivers.
#
# `ffmpeg-rk` is always linked against Vulkan, libplacebo and shaderc, so every image
# carrying it already *has* `hwmap=derive_device=vulkan`, `vf_libplacebo`,
# `scale_vulkan`/`overlay_vulkan` and swscale's Vulkan compute backend compiled in.
# None of them can run without a driver, and the driver is an ICD loaded at runtime
# rather than a library anything links — so no `Depends` pulls it in and it has to be
# asked for. This feature is that ask.
#
# `libvulkan1` is in this list for the same reason, and it is not redundant: ffmpeg is
# built with `!CONFIG_VULKAN_STATIC`, so it **dlopens** the loader rather than linking
# it, and `dpkg-shlibdeps` therefore never sees it. `ffmpeg-rk` Depends on
# `libplacebo360` and `libshaderc1` — which are DT_NEEDED — and on no Vulkan loader at
# all. Without this feature an image has every Vulkan filter compiled in and nothing to
# open: the dlopen fails and ffmpeg reports no Vulkan device. That degrades gracefully,
# which is why it is not a packaging bug, but it does mean this feature is the only
# thing that makes any of it work. Do not drop `libvulkan1` on the theory that the deb
# pulls it in.
#
# It is a feature of its own, and it is a default on the RK3588 bare-ffmpeg recipes
# (recipes/turing-rk1/media-accel-*.toml). Those two facts sit together because the
# question it answers is per-recipe, not per-stack: on a box whose consumer is the
# FFmpeg command line, the Vulkan filters are the fastest scale, tone-map and
# composite route the hardware has — `scale_vulkan` measures 53.8 dB against swscale
# at 18x the efficiency and 2.8x the speed, and libplacebo is the only compositor in
# this build that runs anywhere but the CPU. Shipping the filters without a driver
# would leave an image that quietly does the slow thing, so those recipes carry it.
#
# It stays opt-in everywhere else, and the Jellyfin recipes are the case that matters:
# Jellyfin's `HardwareAccelerationType` is a closed enum with no Vulkan member, and
# under the `rkmpp` type it configures it emits `rkmpp`/`rkrga` filter chains and never
# a Vulkan one. So on a Jellyfin image these packages are reachable from a shell and
# from nothing the server does — a large cost against no path — and that recipe names
# `+vulkan` when its operator wants the command line too.
#
# The gate below is `requires_arch`, not `requires_soc`, but the *default* is scoped to
# RK3588 by the recipes rather than by this file, because conformance is per-GPU: PanVk
# is conformant on the RK3588's Mali-G610 and is not on the RK3576's Mali-G52. Widening
# the gate to arm64 as a default would hand the RK3576 boards 305 MiB they cannot use
# conformantly.
#
# `mesa-vulkan-drivers` supplies PanVk for the Mali in these SoCs. It also supplies
# `lvp` (llvmpipe), a software Vulkan device that enumerates alongside PanVk — pin the
# device explicitly in anything that measures, or a run can silently succeed on the
# CPU while appearing to use the GPU.
#
# `vulkan-tools` is here for the same reason `v4l-utils` is on the RK3588 SoC layer:
# this feature installs a driver, and without `vulkaninfo` nothing in the image can
# say whether it loaded, which device it bound, or whether that device is the GPU.
# The llvmpipe hazard above makes it load-bearing rather than nice to have -- "it
# ran" and "it ran on the GPU" are different claims and only `vulkaninfo` separates
# them. It costs ~5.8 MiB, of which ~3.9 MiB is the X11/Wayland WSI libraries
# `vulkaninfo` links for surface enumeration and a headless box never uses.
description  = "Vulkan GPU userspace (Mesa ICDs + loader) for the GPU filter path"
packages     = ["mesa-vulkan-drivers", "libvulkan1", "vulkan-tools"]

# arm64 only. PanVk targets Valhall and Bifrost; the armv7 boards here are RK3288
# with a Midgard T760, which panfrost drives for GL and PanVk does not drive at all,
# so the 147 MB would buy that board nothing but llvmpipe.
requires_arch = ["arm64"]

caveats = [
  "This feature adds 25 packages and roughly 305 MiB to the installed system, measured against the RK3588 media-accel package set on forky. Two thirds of it is not the driver: `mesa-vulkan-drivers` is 144 MiB, and it depends on `libllvm21` (127 MiB) and through it `libz3-4` (25 MiB), which are there for the `lvp` software rasterizer Debian ships in the same package rather than for PanVk. Debian offers no per-driver package — that one carries the AMD, Intel, NVIDIA, virtio and software back ends as well as the Mali one this hardware uses — so an image that wants PanVk takes all of them and the LLVM they imply.",
  "Vulkan conformance is a per-GPU fact, not a per-feature one. PanVk is conformant on the RK3588's Mali-G610 and is not conformant on the RK3576's Mali-G52; the same package installs on both and only the first carries a conformance claim.",
  "A software Vulkan device (`lvp`, llvmpipe) enumerates alongside the hardware one. Anything that leaves device selection to the default can bind it and run GPU work on the CPU, which is slower than not using this feature at all and does not announce itself.",
]
