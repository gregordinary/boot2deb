# features/media-accel-v4l2.toml — hardware video decode through the kernel's own
# stateless V4L2 API, plus the RGA 2D accelerator. A capability feature, named for
# its provider: the decoder is driven by mainline V4L2 (the `media-accel-rockchip`
# sibling is the same capability provided by Rockchip's vendor MPP stack instead).
#
# What this delivers on RK3576:
#  - HW decode of H.264 and HEVC via the in-kernel VDPU383 driver
#    (`rockchip_vdec`, enabled on the SoC layer) and an ffmpeg built
#    `--enable-v4l2-request`. 8-bit content decodes to `NV12`, 10-bit to `NV15`.
#    No vendor userspace is involved in the decode path.
#  - The RGA 2D raster accelerator: the out-of-tree vendor driver and the DT nodes
#    that bind it (the `rk3576-rga` patch series + `accel/rk3576-rga` fragment,
#    both contributed below), and `librga2` for programs that speak its API.
#
# What it does not deliver is stated in `caveats` at the foot of this file, which
# every recipe composing the feature inherits and the support matrix renders.
#
# The kernel contributions live here rather than on the kernel layer so an RK3576
# build that did not ask for this capability does not carry a 19k-line out-of-tree
# driver it has no consumer for.
description  = "HW video decode via V4L2 stateless (VDPU383) + RGA 2D, for RK3576"
#
# `mesa-vulkan-drivers` is panvk, the Vulkan driver for this SoC's Mali-G52. The
# FFmpeg this feature builds is configured `--enable-vulkan --enable-libplacebo`,
# so without an installed ICD its Vulkan filters and its libplacebo renderer fail
# at device creation — a binary advertising what it cannot do. `libegl1` and
# `libgles2` are the EGL and GLES loaders: Mesa ships the panfrost backend and the
# `libEGL_mesa` implementation underneath them, but a program links the loader, so
# without the pair nothing can open a context on a bound and clocked GPU. All three
# are here rather than on the SoC layer because they serve this feature's media
# paths, and a board that asked for no media capability has no consumer for them.
packages     = ["ffmpeg-rk", "librga2", "mesa-vulkan-drivers", "libegl1", "libgles2"]
requires_soc = ["rk3576"]

# Builds from the SoC's `[userspace]`/`[ffmpeg]` source trees rather than the Debian
# mirror, so resolution requires the SoC to supply them and the build schedules the
# userspace + ffmpeg compile nodes.
requires_media_accel = true

# The RGA driver: the patch series that adds it to the tree, and the kconfig that
# compiles it. Both are needed — a fragment can only turn on code the tree has.
#
# `rk3576-media` is the FFmpeg half: NV15/NV20 format support, so a 10-bit frame the
# VDPU383 decodes can leave the decoder, and the HEVC SPS reference-picture-set
# controls this SoC's rkvdec exposes.
patch_series   = ["rk3576-rga", "rk3576-media"]
config_fragments = ["accel/rk3576-rga"]

# The two media-accel providers are alternatives, not layers: both build an
# `ffmpeg-rk` deb, and only one `./configure` surface can win.
conflicts = ["media-accel-rockchip"]

# The same capability `media-accel-rockchip` declares, so an application feature
# requiring an encoder composes with whichever provider matches the SoC without
# naming either. This build's ffmpeg has no RGA filters (see the caveats below),
# but it is a complete FFmpeg and the encoder a consumer needs.
provides = ["ffmpeg"]

# Limits of the capability itself, inherited by every recipe that composes it.
caveats = [
  "10-bit content decodes to `NV15`, packed 10-bit 4:2:0. The decoder cannot be asked for `P010` instead, because the hardware writes `NV15` natively. ffmpeg here carries the `NV15` format patches, so a 10-bit frame reaches `hwdownload` and the software filters. What that costs is a CPU conversion, because no filter in this build reads `NV15` directly. Vulkan has no such format and Mesa cannot import it, so a Vulkan or libplacebo graph is 8-bit only.",
  "The zero-copy route for 10-bit is the display, not a filter. The display controller scans `NV15` out unconverted. A player that hands the decoder's DMA-BUF straight to a KMS plane therefore plays 10-bit unconverted. RGA is no 10-bit route either. It takes `NV15` in but writes no 10-bit format out: this SoC has RGA2 cores only, and `P010` output is an RGA3 capability.",
  "Nothing packaged by Debian can use this decoder. `ffmpeg-rk` installs to `/opt`, so it coexists with the system FFmpeg. Debian's own libavcodec is built without `--enable-v4l2-request`. It carries no `h264_v4l2request` or `hevc_v4l2request` hwaccel at all. mpv, Kodi and VLC from the archive link that libavcodec, so they decode in software. Reaching the hardware from a player means building the player against this FFmpeg.",
  "ffmpeg has no RGA filters here. `scale_rkrga` and `vpp_rkrga` need `--enable-rkmpp`, and MPP needs the vendor `mpp_service` kernel framework that mainline does not have. ffmpeg scales on CPU or GPU. RGA is reached through librga by a program that speaks its API.",
  "RGA color conversion covers BT.601 limited and full range and BT.709, but not BT.2020.",
  "Pass RGA its buffers as DMA-BUF file descriptors (`importbuffer_fd`). librga's virtual-address import builds an IOMMU mapping per call over ordinary process memory. That faults the RGA IOMMU on roughly a third of jobs. The job then times out after a second, the core is soft-reset, and the destination is left untouched. The same operations over DMA-BUF run clean and about seven times faster.",
]

# The capability's own proof, checked by boot2deb-selftest wherever this feature
# is selected: the RGA node the patch series + fragment above deliver (rga3.ko
# has no module alias, so this is also the check that the modules-load.d wiring
# still loads it), and the FFmpeg binary the feature exists to install.
[[expect]]
check = "devnode"
path  = "/dev/rga"

[[expect]]
check = "file"
path  = "/opt/ffmpeg-rk/bin/ffmpeg"
