# Load the RGA 2D accelerator at boot.
#
# The driver is out of tree and ships only with this feature, so the load lives
# here rather than in the SoC layer's `modules` list — a build that did not ask
# for the capability has no rga3.ko to name.
#
# Naming it is not belt-and-braces: rga3.ko carries no module alias table, so
# coldplug cannot autoload it however the device tree matches. Without this file
# the driver is installed and never loaded, the DT nodes sit unbound and
# /dev/rga never appears.
#
# The module is built as rga3.ko (drivers/video/rockchip/rga3/Makefile:
# obj-$(CONFIG_ROCKCHIP_MULTI_RGA) += rga3.o) despite the Kconfig symbol being
# ROCKCHIP_MULTI_RGA. On RK3576 it binds two `rockchip,rga2` cores and registers
# /dev/rga as a misc character device.
rga3
