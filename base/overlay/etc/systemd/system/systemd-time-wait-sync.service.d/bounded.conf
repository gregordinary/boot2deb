# Generated by boot2deb.
#
# Hold time-sync.target until the clock is trustworthy, but give up after 45 seconds.
#
# A board with no RTC boots with the clock restored from the mtime of
# /var/lib/systemd/timesync/clock -- plausible, and as stale as the board's last
# power-off. Every job that checks a date against that clock is wrong for the few
# seconds until NTP lands: apt rejects Release files and TLS certificates as "not valid
# yet", and logrotate, anacron and e2scrub reason about the wrong day. Debian orders
# those behind time-sync.target already; this is the unit that gives the target meaning.
#
# The bound is the whole point. systemd-time-wait-sync ships TimeoutStartSec=infinity,
# and Debian's anacron.service is both After=time-sync.target and
# Before=multi-user.target -- so on a board that never reaches a time server, the stock
# unit leaves multi-user.target, graphical.target and timers.target permanently
# inactive. Logins still work (sshd, getty and a display manager are pulled in by their
# targets rather than ordered behind them), which makes the failure quiet: the board
# looks fine and no timer ever runs again.
#
# timeout(1) bounds the wait, and the `-` prefix keeps a bounded wait from counting as a
# failed unit -- without it a timed-out oneshot leaves systemctl is-system-running
# reporting `degraded` on every offline boot. Ordering is satisfied when a job finishes
# rather than when it succeeds, and time-sync.target only Wants this service, so the
# boot proceeds either way.
[Service]
ExecStart=
ExecStart=-/usr/bin/timeout 45 /usr/lib/systemd/systemd-time-wait-sync
