# base.toml — the distro-generic rootfs substrate: the base Debian package
# set every boot2deb image installs, plus packages excluded from the base system,
# and the system-wide locale/timezone policy.
# Layer-specific packages (soc/boot-method/device) and feature packages stack on
# top at resolution; overlay files live in each layer's overlay/ tree.

# --- Localization -------------------------------------------------------------
# The `LANG` an image boots with. C.UTF-8 is a complete UTF-8 locale built into
# glibc, so it needs no locale data on disk and no package — it works on the
# smallest possible image. It is also neutral: this project targets no one country,
# and a US locale is not a better default than any other.
locale = "C.UTF-8"

# Locales compiled into every image *in addition to* the one above, so a pre-built
# image can be switched to one of them offline, and so a first-run desktop wizard has
# more than one language to offer — a locale is compiled by `locale-gen` at build time,
# which is a thing no package dependency can do for you later.
#
# en_US.UTF-8 leads the list for a second reason: Debian's stock sshd ships
# `AcceptEnv LANG LC_*`, so an SSH client forwards its own LANG, and a session landing
# on a locale the image never generated is what makes a shell print
# `perl: warning: Setting locale failed`.
#
# The set is the widely-spoken languages, not a complete one — glibc's locale archive
# shares data aggressively, so the marginal cost is far below what a per-locale figure
# suggests. Measured on forky/arm64: C.UTF-8 + en_US.UTF-8 alone is 2.9 MiB of
# /usr/lib/locale/locale-archive, and the full set below is 19.2 MiB. Any locale *not*
# here is still one `dpkg-reconfigure locales` away with no network, because the
# `locales` package ships on the image. `locales-all` is the thing to avoid: it is
# 231 MiB installed.
locales_generate = [
    "en_US.UTF-8",
    "en_GB.UTF-8",
    "de_DE.UTF-8",
    "fr_FR.UTF-8",
    "es_ES.UTF-8",
    "it_IT.UTF-8",
    "nl_NL.UTF-8",
    "pt_BR.UTF-8",
    "pl_PL.UTF-8",
    "uk_UA.UTF-8",
    "ru_RU.UTF-8",
    "vi_VN.UTF-8",
    "ja_JP.UTF-8",
    "ko_KR.UTF-8",
    "zh_CN.UTF-8",
    "zh_HK.UTF-8",
    "zh_TW.UTF-8",
]

# Sets the /etc/localtime symlink. UTC is what a server should log in regardless of
# where it sits; `timedatectl set-timezone` changes it on a running image.
timezone = "UTC"

# The NTP servers systemd-timesyncd reaches for first, as hostnames or bare IPs.
#
# Empty is the right default and writes no configuration at all: Debian compiles its
# own pool into systemd as FallbackNTP, which is correct on any network with a route
# out and assumes nothing about where a board is plugged in. Naming a server here does
# not replace that pool -- it sets NTP=, which timesyncd prefers and falls back from --
# so a value below is a preference, not a commitment, and an image configured for one
# network still finds the time on another.
#
# Worth setting for a board deployed on a network that cannot reach the public pool at
# all, and worth setting for one that can: a time server on the LAN answers in about a
# millisecond, which shortens the window after boot in which the clock is still wrong.
#
# None of the boards here ships a battery-backed RTC, so every one of them boots with a
# clock restored from the mtime of /var/lib/systemd/timesync/clock -- as stale as its
# last power-off -- until NTP corrects it. Images hold the maintenance timers behind
# time-sync.target until that lands (see the systemd-time-wait-sync drop-in in
# base/overlay), so this setting decides how long that wait is, not whether it happens.
ntp_servers = []

# --- Account and access -------------------------------------------------------
# Who can log in to a built image as the default `debian` account, and what reaching
# root costs them. Every key here is overridable per recipe.
#
# Each image gets its own randomly generated first-boot password, expired so it must be
# changed at first login. Three facts about the shipped base decide how much that
# password is protecting, and they are worth knowing before changing anything below:
# openssh-server is installed and Debian enables it, a DHCP client brings the board onto
# the network before anyone has logged in, and `sudo` below is `nopasswd`. So the
# generated password is root on whatever network the board is plugged into, from the
# moment it powers on.
#
# Expiry does not change that. A login against an expired account is permitted and then
# required to *set* the new password — which protects against a credential nobody ever
# rotates, and not at all against someone reaching the board before its owner does.
# Length is what covers that window.

# What `sudo` asks of the default account:
#   "nopasswd" — root with no prompt.
#   "password" — prompts for the account's own password.
# `nopasswd` suits a single-operator board: the account's password was just set at first
# login, and re-typing it to reach root adds nothing that login did not already decide.
# Choose `password` for a board that is shared, that runs anything reachable from
# outside a trusted network, or whose console someone else can walk up to. It is also
# one line to change afterwards on a running board, by rewriting
# /etc/sudoers.d/debian — so this is a default, not a commitment.
sudo = "nopasswd"

# Length of the generated per-image first-boot password, in characters drawn from a
# 56-symbol alphabet with the ambiguous glyphs (0/O/o, 1/l/I) removed — so ~5.8 bits
# each. Accepted range is 8 to 64.
#
# 12 is ~70 bits. That is far past what anyone can reach by guessing at the login, and
# the reason it is not lower is the *other* attack: /etc/shadow travels inside the
# image file, so anyone holding a copy of an image — or of the .provenance.toml beside
# it — can attack the hash offline, with no rate limit and no board involved. 12
# characters puts that out of reach as well.
#
# Before shortening this: the friction is transcribing a password at a console, and
# `ssh_authorized_keys` below removes that entirely without giving anything up. Reach
# for it first. If you do shorten, 8 (~46 bits) is the floor and it is a real floor —
# still far beyond guessing at an sshd that services tens of attempts per second, but
# with the offline margin spent. It suits an image one operator flashes and boots, not
# one that is copied or published.
first_boot_password_length = 12

# SSH public keys authorized for the default account, one authorized_keys line each —
# the key material itself, not a path to it (a path would resolve differently on another
# machine, and the point of writing a key down is that every build carries it). Public
# keys are not secret, so they belong in config.
#
# This is the friendly answer to a long password: with a key here you never type the
# password at all, and it becomes the console fallback for the day the key is on a
# laptop you do not have. Empty here so a stock build authorizes nobody; set it in your
# own recipe, or once for every recipe via a base.toml overlay (see the Overlays
# reference).
#
#   ssh_authorized_keys = ["ssh-ed25519 AAAAC3Nza... operator@workstation"]
#
# Authorize the *public* key — the `.pub` file. A private key here is refused.
ssh_authorized_keys = []

# --- Packages -----------------------------------------------------------------
# The base system is Debian's `required` + `important` priority set; everything below
# stacks onto it. Two properties of the install decide what has to be named here:
# dependency resolution follows `Depends` only — **`Recommends` are never installed** —
# and priority `standard` is not part of the base set. So a package that an ordinary
# Debian install would have arrived at by either route is absent unless it is listed.
# `ca-certificates` is the case to keep in mind: it is priority `standard` and merely
# *Recommended* by libcurl, so it reaches the image only by being named here — and
# without it, curl and wget cannot fetch an https URL at all.
packages = [
    # Boot and system services.
    "initramfs-tools",
    "dbus",
    "dhcpcd",
    "libpam-systemd",
    "systemd-timesyncd",
    "sudo",

    # Remote access, both directions. The server's `Depends` already pull
    # openssh-sftp-server, so scp/sftp *to* a board works without the client; the
    # client is what makes scp, sftp, ssh-keygen and ssh-copy-id work *from* it.
    "openssh-server",
    "openssh-client",

    # Fetching and moving files. ca-certificates is what makes the https half of curl
    # and wget function.
    "ca-certificates",
    "curl",
    "wget",
    "rsync",

    # Name resolution, for triaging a board whose network is the thing that is wrong:
    # dig and host. ~6 MiB with bind9-libs.
    "bind9-dnsutils",

    # Archives.
    "unzip",
    "zip",
    "xz-utils",
    "zstd",

    # Hardware inventory. usbutils earns its place ahead of pciutils on these boards —
    # an SBC's peripherals are far more often on USB than on PCIe.
    "pciutils",
    "usbutils",

    # Looking at a running system, and at bytes.
    "htop",
    "lsof",
    "psmisc",
    "xxd",
    # `file` costs ~10.6 MiB, nearly all of it libmagic-mgc's compiled magic database.
    "file",

    # Shell usability. man-db brings groff-base, bsdextrautils and libpipeline1 for
    # ~9.2 MiB total, which buys the ~3.9 MiB of manual pages the image already carries
    # from every other package and otherwise has no reader for.
    "bash-completion",
    "man-db",

    # The three packages that make a *pre-built* image reconfigurable with no network.
    # `dpkg-reconfigure locales` / `keyboard-configuration` / `tzdata` only exist if
    # the package does, so an image without them forces a user who wants a German
    # locale or a UK keymap onto the network before the knob even appears. Measured on
    # forky/arm64 they cost ~44 MiB installed (locales 15.4 + xkb-data 10.6 +
    # console-setup-linux 7.1 + libc-l10n 4.7 + kbd 2.9 + keyboard-configuration 2.8 +
    # console-setup 0.4), plus the generated locale-archive above.
    "locales",
    "keyboard-configuration",
    "console-setup",
]
exclude = ["isc-dhcp-client"]
