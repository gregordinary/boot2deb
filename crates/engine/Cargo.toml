[package]
name = "boot2deb-engine"
description = "boot2deb engine: compile/patch/rootfs/image stages and host preflight"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
boot2deb-core.workspace = true
serde.workspace = true
# Serializes the diffable build-signature stamp (`<tree>.sig`) that `why-rebuild`
# diffs. Pure Rust, already in the tree via core.
toml.workspace = true
# Format-preserving TOML editing for `patch import`: slot a patch into a
# series' scope list without disturbing the file's comments/layout. It reads and
# writes through the same `toml_parser` and `toml_writer` that `toml` does, so it
# adds no crate to the build beyond itself.
toml_edit = "0.25"
thiserror.workspace = true
sha2.workspace = true
# RSASSA-PKCS1-v1_5 signing and verification for the vboot kernel partition a press
# re-signs under a fresh identity (image::vboot). Pure Rust, RustCrypto. Its 0.9 line
# takes hashes of the older `digest` generation, so vboot states the SHA-256
# `DigestInfo` header itself rather than deriving it from `sha2`.
rsa = "0.9.10"
# Reads the vendored apt keyrings the trust-anchor audit holds to their fingerprint
# manifests (keyring.rs): their certificates, each primary key's fingerprint, and
# whether a key is one the bootstrap's signature verifier can use. The same OpenPGP
# implementation ferroday-cage verifies archive signatures with, so the audit and the
# verifier read a keyring alike. Safe Rust with no dependencies of its own.
irongall = "0.1.1"
# Pure-Rust image assembly: GPT tables, ext4 formatting, and .xz compression — no
# C deps. lzma-rust2's `optimization` feature (its only `unsafe`) is left off.
gpt = "4"
# Deterministic ext4 UUID + GPT disk/partition GUIDs derived from the lock, so the
# image carries no `/dev/urandom` identifiers. Same major as gpt.
uuid.workspace = true
# The decoder is unconditional (only the encoder is feature-gated); `flash`
# streams a compressed image through it straight onto the target device.
#
# Held at the version `ferroday-cage` reads its own `.xz` through, so the graph
# carries one copy of the format rather than two. This line's encoder takes a single
# stream past 2 GiB, which is inside the range an image reaches.
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "xz", "encoder"] }
# `.gz` image compression, for the one consumer that cannot read `.xz`: u-boot's
# `gzwrite` decompresses gzip only, so an image a board writes to its own disk from
# the bootloader has to be in that container. `rust_backend` is miniz_oxide — pure
# Rust, no zlib, and already in the tree transitively.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Reads the `.deb`s a build produces so the package rules can hold them (debfile.rs):
# the tar members stream through their decompressor, and a `zstd`-compressed member
# reads through ruzstd. Both are already in the tree, tar under ferrosys with the same
# features off and ruzstd under ferroday-cage, so neither adds a crate to the build.
tar = { version = "0.4", default-features = false }
ruzstd = "0.9"
# Pure-Rust ext2/3/4 formatter (see the engine's image::ext4): builds the resize-safe
# rootfs filesystem directly from the rootfs tar, replacing host mke2fs/e2fsprogs and
# the userns staging they required. The `tar` feature carries the archive source that
# reads the rootfs tarball's ownership, xattrs, ACLs, and device nodes, and reads each
# member's bytes out of the archive as that file is placed rather than buffering the
# whole rootfs.
# `fat` additionally formats the 1 MiB FAT12 seed partition every image carries
# (see the engine's press::seed) — a text file an operator can edit from any OS.
# `dir` adds the host-directory walk `press --copy-tree` places a site tree
# with: it yields the same `SourceEntry` values the tar source does, recording
# symlinks rather than following them and leaving file bytes on the host until
# the formatter places them.
# The families are named rather than taken from the crate's default, which carries
# every family it has, APFS and its decoders among them. With this set ferrosys
# compiles only its own MIT OR Apache-2.0 code, and only the families boot2deb writes
# and reads.
ferrosys = { version = "0.7", default-features = false, features = ["ext", "tar", "fat", "dir"] }
# Pure-Rust build sandbox (see the engine's sandbox module): enters the
# target-arch rootfs and runs each package-build command in fresh namespaces
# with the caller mapped to root, replacing the external `bwrap` binary. The
# `debian` feature adds the in-process archive provisioner that bootstraps the
# target suite/arch rootfs (pure Rust: tar extraction + OpenPGP release
# verification, no external binary, no C dep).
ferroday-cage = { version = "0.5.0", features = ["debian", "subid"] }
# Randomly-named, fail-if-exists staging dirs for the build's intermediate trees,
# so a local user cannot pre-create and own one.
tempfile.workspace = true
# Every HTTP(S) fetch boot2deb makes itself: pre-built `extra_debs` and the .NET pins
# (netfetch.rs), the `https://` half of the archive transport (archfetch.rs), and the
# listings `patch import` and `outdated` read. TLS through rustls against the bundled
# webpki roots, never the host's certificate store; blocking, no async runtime.
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
# In-process clone of the `patches` repo at the lock-pinned commit, so a build with
# no local checkout auto-fetches the series. Blocking HTTP/S transport over reqwest +
# rustls (no libcurl, no OpenSSL), plus `worktree-mutation` for the detached checkout
# of the exact pinned commit into the cache. reqwest's rustls takes its cryptography
# from aws-lc-rs, which builds C with `cc`, and verifies against the host's
# certificate store.
gix = { version = "0.90", default-features = false, features = [
    "sha1",
    "blocking-network-client",
    "blocking-http-transport-reqwest-rust-tls",
    "worktree-mutation",
] }
# Safe syscall wrappers for the engine's direct host calls: the `verify-sources` probe's
# process-group kill, the build's umask, the overlay's symlink-preserving timestamps,
# and the `shell` session's standard streams and their starting window size. The
# session's relay itself is ferroday-cage's. Already in the tree under ferroday-cage
# and ferrosys with these features on.
rustix = { version = "1.1", features = ["fs", "process", "termios", "stdio"] }
# Pure-Rust `sha512crypt` for the image's first-boot `/etc/shadow` entry (see the
# engine's secret module), replacing a shell-out to the host `openssl passwd -6`.
# Same RustCrypto family as sha2/sha1, and portable: LibreSSL's `openssl passwd`
# has no `-6`, so the host tool was also the one thing keeping image assembly off a
# macOS host. The salt comes from `/dev/urandom` here, so no `getrandom` feature.
sha-crypt = "0.6"

[dev-dependencies]
# NDJSON wire-shape tests for the --json event stream (event.rs), and the pin of the
# sandbox library's resolved record (sandbox.rs).
serde_json.workspace = true
# The same ferroday-cage with its `serde` feature, for tests only: the sandbox record's
# completeness test reads every key the library's resolved inputs carry through the
# library's own serialization of them.
ferroday-cage = { version = "0.5.0", features = ["serde"] }

[lints]
workspace = true
