[package]
name = "boot2deb-core"
description = "boot2deb config model, layer resolution, and lock/kconfig formats"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
# The strict reader for the file manifests boot2deb writes (`files`). A UAPI.16 manifest
# carries nanosecond timestamps past 2^53, which this parser keeps exact as `u64`.
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
semver.workspace = true

[dev-dependencies]
# Fixture config roots for resolution tests, decoupled from the shipped layers.
tempfile.workspace = true
