# kernels/rk3576-mainline-7.1-console.toml -- mainline 7.1.x for RK3576, on the
# rk3576-console patch profile. Identical to rk3576-mainline-7.1 except for the
# profile: this one carries the USB-host console u-boot patches on top of the
# loader series, so a maskrom-RAM u-boot can be driven on the box with a USB
# keyboard and stick. The kernel tree itself is still built pristine (the
# console profile's kernel/ffmpeg/userspace series are empty); only u-boot
# differs. patch_profile is a kernel-layer field, so selecting the console
# u-boot means selecting this kernel entry.
flavor           = "mainline"
source           = "linux-stable"        # 7.1.x stable releases live in linux-stable
track            = "7.1.y"               # resolved to an exact tag/SHA in the lock (v7.1.3)
base_defconfig   = "defconfig"           # in-tree arm64 base; fragments merge onto it
config_fragments = ["base/debian-arm64", "soc/rk3576"]
patch_profile    = "rk3576-console"      # loader series + USB host (drd0 = host); no kernel patches
# Clone URL of the patches repo, so a build with no local checkout auto-fetches
# the series at the lock-pinned commit. Override with --patches-url, or point
# --patches-path at a local checkout to co-develop the series.
patches_url      = "https://github.com/gregordinary/patches.git"
supported_socs   = ["rk3576"]
