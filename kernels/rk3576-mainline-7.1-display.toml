# kernels/rk3576-mainline-7.1-display.toml -- mainline 7.1.x for RK3576, on
# the rk3576-display patch profile: the shipping u-boot. USB host, HDMI
# console, clock bring-up and timer fix, autobooting with a ten-second
# interruptible delay, and no developer commands. The kernel tree itself is
# still built pristine (the display profile's kernel/ffmpeg/userspace series
# are empty); only u-boot differs. patch_profile is a kernel-layer field, so
# selecting the shipping u-boot means selecting this kernel entry.
flavor           = "mainline"
source           = "linux-stable"        # 7.1.x stable releases live in linux-stable
track            = "7.1.y"               # resolved to an exact tag/SHA in the lock (v7.1.3)
base_defconfig   = "defconfig"           # in-tree arm64 base; fragments merge onto it
config_fragments = ["base/debian-arm64", "soc/rk3576"]
patch_profile    = "rk3576-display"      # USB host + HDMI console + autoboot
# Clone URL of the patches repo, so a build with no local checkout auto-fetches
# the series at the lock-pinned commit. Override with --patches-url, or point
# --patches-path at a local checkout to co-develop the series.
patches_url      = "https://github.com/gregordinary/patches.git"
supported_socs   = ["rk3576"]
