# boot2deb: the kernel command line GRUB's menu boots this board with. Sourced by
# update-grub (grub-mkconfig) after /etc/default/grub, so the values here win.
#
# The board's arguments come from /etc/boot2deb/board.conf, which boot2deb generates
# from the device: rootwait, the console log level, and anything the board needs.
. /etc/boot2deb/board.conf

# rw, so systemd brings up machine-id, the journal and the first-boot units on a
# writable root from PID 1. The menu line reads `ro` before these, and the kernel takes
# the last of the two.
GRUB_CMDLINE_LINUX="rw ${KERNEL_CMDLINE}"

# Debian's default adds `quiet`; the console log level in KERNEL_CMDLINE decides what
# the console shows.
GRUB_CMDLINE_LINUX_DEFAULT=""

# root= names the partition, as /etc/fstab does, rather than the filesystem.
GRUB_DISABLE_LINUX_UUID=true
GRUB_DISABLE_LINUX_PARTUUID=false

# The firmware's own console: its serial port, and its screen where it has one. Debian's
# default is GRUB's graphical terminal, which draws on a screen alone, and most of these
# boards are run from their serial console.
GRUB_TERMINAL=console
