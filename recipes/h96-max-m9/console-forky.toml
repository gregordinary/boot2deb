# recipes/h96-max-m9-console-forky.toml -- the on-device u-boot console variant
# for the H96 MAX M9. Same device, suite, blobs, and layout as
# h96-max-m9-forky; the only difference is the kernel entry, which carries the
# rk3576-console patch profile (USB host + drd0 forced to host) instead of
# rk3576-loader. The deliverable is the maskrom USB boot images (usb471/472)
# from `--stage uboot`: push them into RAM via maskrom and drive u-boot with a
# USB keyboard and stick. The kernel/rootfs/image parts resolve identically to
# the base recipe and are unused for the recovery-console tool.
#
# This does NOT replace h96-max-m9-forky's maskrom u-boot, which keeps drd0 as
# the rockusb/ums device port for laptop-driven flash and dump.
device     = "h96-max-m9"
kernel     = "rk3576-mainline-7.1-console"
suite      = "forky"
features   = []                # base build; media-accel is not modeled for RK3576 yet
layout     = "combined"
image_size = "2G"

# A maskrom bring-up tool: the deliverable is the u-boot USB boot images, not a
# flashed rootfs. The console u-boot is hardware-exercised; the recipe as a whole
# is "expected".
[support]
status = "expected"
date   = "2026-07-20"
