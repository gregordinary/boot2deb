# recipes/h96-max-m9/media-accel.toml -- the H96 MAX M9 with hardware video
# decode and the RGA 2D accelerator, on mainline 7.2 / Debian forky. Constraints
# only; the exact resolution is written to the sibling .lock by
# `boot2deb update h96-max-m9/media-accel`.
#
# The base h96-max-m9/forky image plus the `media-accel-v4l2` capability: an
# ffmpeg-rk built `--enable-v4l2-request` that decodes H.264/HEVC on the SoC's
# VDPU383, and the out-of-tree RGA driver with librga2. Decode is the kernel's own
# stateless V4L2 path -- no vendor MPP is involved, and none exists for this SoC.
#
# Encode is software: mainline has no RK3576 encoder driver. Scaling is CPU or GPU,
# because the rkrga ffmpeg filters require MPP. See features/media-accel-v4l2.toml
# for the full capability statement.
device     = "h96-max-m9"
kernel     = "rk3576-mainline-7.2"
uboot_series = "rk3576-display"
suite      = "forky"
features   = ["media-accel-v4l2"]
layout     = "combined"
image_size = "3G"

# `sudo` prompts for the account's own password on this image. The box runs on a shared
# home network and its console is within anyone's reach, so reaching root costs one more
# proof than logging in. `h96-max-m9/forky` keeps the shipped `nopasswd` default.
sudo       = "password"

# The kernel's GPU fix and the u-boot chain are hardware-validated on this board,
# and Panfrost + Mesa render first-party at 4K.
#
# What the move from v7.1.7 to the v7.2 generation changes on this SoC's paths. The pin
# is v7.2.8, the current stable point release. No 7.2.y point release touches an RK3576
# device tree or a defconfig, but 7.2.4, 7.2.5 and 7.2.7 do reach the drivers this recipe
# builds: `drivers/accel/rocket` gains the job-push, task-array, domain-reference and
# run-path error handling this board's NPU series used to carry, so four of those
# patches retire and four more are rebased onto the kernel's own error paths; and the
# V4L2 core bounds the HEVC tile counts the VDPU383 reads, so the SoC's fix series
# carries no patch for it.
#
# The aic8800 module follows radxa's `main`, whose tip splits the firmware path into a
# compiled-in root and a per-chip subdirectory; `kmods/aic8800.toml` takes both halves,
# so the driver still requests its firmware from `aic8800_fw/SDIO/aic8800D80`.
#
# Nothing in the `rk3576-fixes` series is specific to the generation: rk3576/100-104
# read the same on 7.1.7 and 7.2, and the other five are written against 7.2. Two of
# them answer a point release. media-accel/083 makes the `delta_idx_minus1` guard 7.2.5
# adds return `-EINVAL`, a bound its own validation already enforces. rk3576/109 applies
# over 7.2.5's `platform_get_irq()` check in the probe.
#
# `rockchip-iommu` clears the AUTO_GATING
# fetch-DTE time limit, which upstream reports as the cause of RGA3 hangs and of the
# vendor kernel's VOP black screens; every accelerator here maps through that IOMMU.
# `rkvdec` moves its H.264 and HEVC backends off local bitfield structs onto a shared
# bitwriter -- a codegen fix aimed at clang on armhf and hexagon, writing the same
# register payloads -- and this board's own read-cache patch (rk3576/104) sits beside
# it unchanged, since it maps the "cache" bank by name. `rockchip_sai` takes a
# `guard()` conversion for its spin locks, partly reverted in the same release; the
# board's SAI routing patch (rk3576/103) applies over the result untouched. The
# `rk3576.dtsi` changes are additions for other boards -- Khadas Edge 2L peripherals,
# `pinctrl-names`, HDMI FRL enable GPIOs -- and none of them names this one.
#
# Mainline still has no Rockchip video *encoder*, so nothing changes there.
#
# Two of those land on this recipe's own paths. The RGA it builds is the multicore
# vendor driver, and 7.2's in-tree V4L2 RGA3 support is RK3588 silicon only, so this
# board's RGA2 cores and the `rk3576-rga` series that wires them are untouched by it --
# but the IOMMU fetch-DTE change upstream ties to RGA3 hangs is on the same shared
# driver these cores map through. And `rkvdec`'s bitwriter move is on the decode path
# this recipe exists to exercise.
#
# What the claim rests on. An image built from this recipe boots on the board and every
# path the recipe exists to provide is exercised there: `boot2deb-selftest` passes all
# twenty of its hardware checks; decode is bit-exact against this same ffmpeg's software
# decoder, frame by frame across 300-frame clips, for H.264 Baseline and High and HEVC
# Main at 1080p, H.264 High and HEVC Main at 4K, and the 10-bit H.264 High 10 and HEVC
# Main 10 profiles whose frames leave the decoder as `NV15`; 4K HEVC decodes at 136 fps
# for a third of one core, and four concurrent 4K30 streams hold real time; RGA converts
# colour and downscales exactly over DMA-BUF imports, with no IOMMU fault over 600 jobs;
# Panfrost opens a GLES 3.1 context that rasterises, and the Vulkan filters and the
# libplacebo renderer both run on panvk.
#
# The claim is `expected` rather than `validated` because the lock has moved since that
# image: it booted kernel v7.2.3 with patches `daa40ed`, and the pins here are v7.2.8
# with patches `ec8acfd`. The kernel bump retires four of the NPU patches that image
# carried, which 7.2.4 now supplies itself, and rebases four more onto its error paths.
# In the media path one thing moved: the HEVC tile-count bound that image took from the
# series now comes from the kernel, which leaves the decode of a conforming stream as it
# was. None of the exercised paths above has a reason to change; the claim returns to
# `validated` when an image at these pins boots the board.
[support]
status = "expected"
date   = "2026-09-14"
