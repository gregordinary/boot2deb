# recipes/h96-max-m9/media-accel.toml -- the H96 MAX M9 with hardware video
# decode and the RGA 2D accelerator, on mainline 7.3 / Debian forky. Constraints
# only; the exact resolution is written to the sibling .lock by
# `boot2deb update h96-max-m9/media-accel`.
#
# The base h96-max-m9/forky image plus the `media-accel-v4l2` capability: an
# ffmpeg-rk built `--enable-v4l2-request` that decodes H.264/HEVC on the SoC's
# VDPU383, and the out-of-tree RGA driver with librga2. Decode is the kernel's own
# stateless V4L2 path -- no vendor MPP is involved, and none exists for this SoC.
#
# Encode is software: mainline has no RK3576 encoder driver. Scaling is on the CPU,
# because the rkrga ffmpeg filters require MPP and this GPU has no Vulkan driver. See
# features/media-accel-v4l2.toml for the full capability statement.
device     = "h96-max-m9"
kernel     = "rk3576-mainline-7.3"
uboot_series = "rk3576-display"
suite      = "forky"
features   = ["media-accel-v4l2"]
layout     = "combined"
image_size = "3G"

# The kernel's GPU fix and the u-boot chain are hardware-validated on this board,
# and Panfrost + Mesa render first-party at 4K.
#
# What the move from the 7.2 generation changes on this SoC's paths. The pin is v7.3.
# `h96-max-m9/forky` describes the board-wide part: the IOMMU fixes the NPU series no
# longer includes, the regenerated power-domain patches, the aic8800 7.3 guard, and the
# HDMI PHY and `dw_hdmi_qp` changes that make the display the first thing to check on a
# new image.
#
# On this recipe's own paths: the RGA it builds is the multicore vendor driver, and the
# kernel's in-tree V4L2 RGA3 support is RK3588 silicon only, so this board's RGA2 cores
# and the `rk3576-rga` series that wires them are untouched by it; all three of that
# series' patches apply unchanged. `rkvdec` computes its CTB counts with
# `DIV_ROUND_UP()`, which gives the same values, on the decode path this recipe exists
# to exercise, and hantro releases its media entities on its error and remove paths.
# The IOMMU's stale-fault acknowledgement before a stall was already in the images this
# recipe built, through the NPU series. Mainline still has no Rockchip video *encoder*.
#
# What the claim rests on. An image built from this recipe boots on the board and every
# path the recipe exists to provide is exercised there: `boot2deb-selftest` passes all
# twenty of its hardware checks; decode is bit-exact against this same ffmpeg's software
# decoder, frame by frame across 300-frame clips, for H.264 Baseline and High and HEVC
# Main at 1080p, H.264 High and HEVC Main at 4K, and the 10-bit H.264 High 10 and HEVC
# Main 10 profiles whose frames leave the decoder as `NV15`; 4K HEVC decodes at 136 fps
# for a third of one core, and four concurrent 4K30 streams hold real time; RGA converts
# color and downscales exactly over DMA-BUF imports, with no IOMMU fault over 600 jobs;
# and Panfrost opens a GLES 3.1 context that rasterises. That image also contained
# `mesa-vulkan-drivers`, which this recipe does not. On this GPU it provided only the
# software `lvp` device, and none of the paths above used it.
#
# The claim is `expected` rather than `validated` because the lock has moved since that
# image: it booted kernel v7.2.3 with patches `daa40ed` on u-boot v2026.07, BL31 v1.24
# and DDR init v1.12, and the pins here are v7.3 with patches `339beaf` on u-boot
# v2026.10, BL31 v1.25 and DDR init v1.13, the bootloader `h96-max-m9/forky`
# describes. Of the NPU patches that image included, the kernel now supplies six itself
# -- four rocket fixes from 7.2.4 and the two Rockchip IOMMU fixes from 7.3 -- and four
# more are rebased onto its error paths.
# The NPU series at this pin follows its upstream v14 posting, which pulses the NPU
# domain's bus reset before the power-on settle rather than after it, and the board's
# device tree hands the NPU rail to that domain as its supply. In the media path one
# thing moved: the HEVC tile-count bound that image took from the series now comes from
# the kernel, which leaves the decode of a conforming stream as it was. None of the
# exercised paths above has a reason to change; the claim returns to `validated` when an
# image at these pins boots the board.
[support]
status = "expected"
date   = "2026-10-19"
