# recipes/turing-rk1/util.toml — the Turing RK1's recovery and bring-up u-boot,
# as a u-boot-only deliverable. It is the shipping recovery u-boot plus a boot
# menu, memtest, image hashing, `wget`, and raw partition read/write: the tool
# for a module whose OS will not boot, or whose disks need work before an OS
# exists.
#
# Delivery is a flash, not a stream. The RK3576 tools are pushed into RAM over
# maskrom; the RK1 has no such path on a cluster carrier, so this is written to
# the eMMC with the same `--stage uboot` boot image every RK1 recipe emits, and
# driven at the prompt over the module's UART. Because it stays installed
# between sessions it keeps mainline's interruptible autoboot, so a module with
# a working OS still boots it.
#
# What it is for, concretely: the carrier's management controller writes eMMC
# and nothing else, so an NVMe on the M.2 slot has no path to a host. Boot this,
# interrupt the countdown, and either export the disk (`ums 0 nvme 0`, then
# write it from the carrier) or pull an image in and write it on the module
# (`dhcp`, `tftp`/`wget`, `gzwrite nvme 0 ${loadaddr} ${filesize}`), hashing it
# before and after.
#
# Being a pure bootloader tool unrelated to any Debian release, it names no
# suite, kernel, or image — only the u-boot series.
device       = "turing-rk1"
deliverable  = "uboot"
uboot_series = "turing-rk1-util"

# Built clean from mainline u-boot with the two board defconfig patches, and not
# yet exercised on hardware in this form. The commands it adds are stock u-boot
# ones whose drivers the board defconfig already enabled, but no RK1 has been
# booted on this image, which is what "expected" says.
[support]
status = "expected"
date   = "2026-08-05"
