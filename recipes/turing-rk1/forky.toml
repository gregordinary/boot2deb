# recipes/turing-rk1/forky.toml — the Turing RK1 base image on Debian forky.
# The board's supported suite. A base image: a full Debian userland plus the
# accel-capable kernel. The rk3588-mainline-7.2 kernel bakes in the rk3588-accel
# patch series and the accel/full kconfig, so the VEPU/VDPU/RGA and NPU drivers
# are present in the kernel — the hardware blocks are there, just dark. What a base
# image omits is the Rockchip media *userspace* (MPP + RGA + ffmpeg-rk); add it
# later from the media-accel debs, or build it in from the start with
# turing-rk1/media-accel-forky.
#
# The u-boot it ships carries the turing-rk1-recovery series, whose one patch adds
# `ums`. That is what lets a disk on the M.2 slot be written from the carrier at
# all: the management controller writes the module's eMMC and nothing else, so
# without it an NVMe u-boot enumerates perfectly well has no path to a host.
# Constraints only; the exact resolution is written to the sibling .lock.
device     = "turing-rk1"
kernel     = "rk3588-mainline-7.2"       # omit -> device default_kernel
suite      = "forky"                     # omit -> device default_suite
features   = []                          # base: accel kernel, no media userspace
layout     = "combined"                  # omit -> device default_layout
image_size = "2G"

# The pin is v7.2.9, the current stable point release. The last one that booted was
# v7.2.2, on 2026-09-02. No 7.2.y point release touches a defconfig or the RK1's own
# device-tree source. The one change to the RK3588 SoC's shared device tree gives its two
# eDP controllers an `hclk`, and this board leaves both disabled. 7.2.9 fixes the
# step_wise thermal governor for cooling maps with a non-zero lower bound. The RK1's five
# fan steps have that shape. Before the fix, a step whose trip no longer applied could
# keep its vote and hold the fan above the speed the temperature asks for. The same
# release fixes the stmmac RX path this board's Ethernet runs on. What follows is
# therefore written against the generation. What the move from v7.1.7 changes, on the
# paths this image runs:
#
# The patch series changes shape under it. The Verisilicon IOMMU that fronts the AV1
# decoder is in the tree from 7.2, in a copy two cleanups newer than ours, so the series
# carries no patch for it and `CONFIG_VSI_IOMMU=m` moves to the `accel/full` fragment,
# which is now its only owner. 7.2.4 then takes the rocket driver's job-push and
# task-array fixes, retiring two more of the series' patches and rebasing two onto the
# kernel's own error paths, and 7.2.7 bounds the HEVC and AV1 tile counts in the V4L2
# core and the VPU981 driver, so the series carries no tile-count patch and its SPS RPS
# bound applies onto the kernel's own validation. 072 is the 7.2 variant, because
# the dtsi now describes all three RGA cores for the in-tree V4L2 RGA3 driver rather
# than only the RGA2 one; the image keeps the multicore vendor driver and its
# `/dev/rga`, so the patch retargets those nodes instead of creating them, and
# `VIDEO_ROCKCHIP_RGA` stays unset. 071 gains one line, because 7.2 removes
# `strncpy()` from the kernel outright and the vendor RGA driver had a call site.
#
# `rockchip-iommu` clears the AUTO_GATING fetch-DTE time limit, which upstream
# reports as the cause of RGA3 hangs and of the vendor kernel's VOP black screens.
# Every accelerator on this board maps through that IOMMU, so it reaches decode, RGA
# and the NPU alike -- the one change here that could move behaviour on hardware.
#
# `rkvdec` moves its H.264 and HEVC backends off local bitfield structs onto a shared
# bitwriter. It is a codegen fix aimed at clang on armhf and hexagon, and it writes
# the same register payloads. `rk3588-base.dtsi` also gains a `vicap` node and the
# MIPI CSI-2 receivers, both `status = "disabled"` in the dtsi and neither enabled by
# this board -- the camera path is new hardware description, not a new driver running
# here. The rocket NPU driver is a net zero across the release: one commit and its
# revert. panthor takes a long run of fixes, none of which this image can reach, since
# the RK1 recipes install no Mesa.
#
# u-boot does not move with this bump: it stays at v2026.07.
#
# `expected` until an image from this pin boots. The last image on the board is the
# feature variant `forky+media-accel-rockchip+jellyfin+jellyfin-rockchip+vulkan+avs-decode`
# at v7.2.2 and patches 6e886797a212, booted 2026-09-02; it exercised the kernel,
# u-boot, device layers and the media stack end to end. The kernel and its patch
# series are what have moved since.
[support]
status = "expected"
date   = "2026-09-05"
