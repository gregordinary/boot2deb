# recipes/turing-rk1/forky.toml — the Turing RK1 base image on Debian forky.
# The board's supported suite. A base image: a full Debian userland plus the
# accel-capable kernel. The rk3588-mainline-7.3 kernel bakes in the rk3588-accel
# patch series and the accel/full kconfig, so the VEPU/VDPU/RGA and NPU drivers
# are present in the kernel — the hardware blocks are there, just dark. What a base
# image omits is the Rockchip media *userspace* (MPP + RGA + ffmpeg-rk); add it
# later from the media-accel debs, or build it in from the start with
# turing-rk1/media-accel-forky.
#
# The u-boot it ships carries the turing-rk1-recovery series, whose one patch adds
# `ums`. That is what lets a disk on the M.2 slot be written from the carrier at
# all: the management controller writes the module's eMMC and nothing else, so
# without it an NVMe u-boot enumerates perfectly well has no path to a host.
# Constraints only; the exact resolution is written to the sibling .lock.
device     = "turing-rk1"
kernel     = "rk3588-mainline-7.3"       # omit -> device default_kernel
suite      = "forky"                     # omit -> device default_suite
features   = []                          # base: accel kernel, no media userspace
layout     = "combined"                  # omit -> device default_layout
image_size = "2G"

# The pin is v7.3. What the move from the 7.2 generation changes, on the paths this
# image runs:
#
# The patch series gets shorter. 7.3 carries the rocket driver's slot search on core
# removal and on scheduler lookup, so the series no longer carries either; 095, which
# numbers each core by its devicetree position, still applies on top. 101, the crypto
# offloader, is regenerated only because 7.3 moved `qcom-rng` out of `drivers/crypto`,
# a line its Makefile context named.
#
# `rockchip-iommu` keeps its page-table ops per device instead of in one global, takes
# every clock the devicetree lists, and acknowledges a stale page fault before it asks a
# bank to stall. Every node it binds on this SoC lists exactly the `aclk` and `iface` pair
# the driver took before, so the clock change is a no-op here. The stall change reaches
# decode, RGA and the NPU alike, and it is the one change here that could move
# behaviour on hardware. The PCIe controller driver can now reset its root port when the
# link goes down, which reaches the M.2 slot and the second PCIe port this board
# enables.
#
# `rkvdec` computes its CTB counts with `DIV_ROUND_UP()`, and hantro releases its media
# entities on its error and remove paths; neither changes what the decoders are
# programmed with. The rocket driver otherwise gains only a cleared pointer on a failed
# init. The RK3588 device tree gives both eDP controllers an `hclk`, and this board
# leaves both disabled; nothing in the RK1's own source moves. The HDMI PHY takes a run
# of fixes and panthor a run of bounds checks, neither of which this image reaches: the
# RK1 enables no HDMI, and the base image installs no Mesa. The kernel configuration
# differs from 7.2.9's in 47 symbols, none of them on a Rockchip, media, NPU or GPU
# path. 7.3 removes EFS, freevxfs and openvswitch's legacy tunnel types, and fscrypt now
# always encrypts block-device contents through blk-crypto, which turns on
# `BLK_INLINE_ENCRYPTION` and its software fallback.
#
# The bootloader is u-boot v2026.10 with rkbin's BL31 v1.56 and DDR init v1.24, a pair
# Rockchip requires: the DDR blob's dual-channel detection needs BL31 v1.53 or later.
# BL31 links at 0x60000 and ends at 0xD1000, clear of the SPL below 0x40000 and of the
# FIT buffer at 2 MiB. The DDR blob keeps v1.19's UART, frequency steps and channel
# mask; what it changes for LPDDR4X is the high-temperature refresh derate and its
# training retries. u-boot v2026.10 sizes the DRAM banks earlier in start-up, and the
# kernel's memory node is built from that result, so `bdinfo` and `/proc/iomem` are the
# first thing to compare on a new image. It also fixes a `gzwrite` that could fail with
# `inflate() returned -5`, lets `ums` run twice in one session, and has `ums` report
# `serial#` as its USB serial number.
#
# `expected` until an image from this pin boots. The last image on the board is this
# recipe at v7.2.9 and patches a74f07a5df1f on u-boot v2026.10, booted 2026-10-08: the
# selftest passed 15 of 15, a 30-minute memory stress over 85% of RAM verified clean,
# and five warm reboots each came back with the same four DRAM banks. It was built from
# a tree with uncommitted changes, so it carries no claim of its own. The kernel and its
# patch series are what have moved since.
[support]
status = "expected"
date   = "2026-10-19"
