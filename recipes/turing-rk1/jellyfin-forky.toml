# recipes/turing-rk1/jellyfin-forky.toml — the "accelerated Jellyfin on a Turing
# RK1" use case. The scenario lives in the recipe name; the reusable building
# blocks are the features it composes: the `jellyfin` application feature, the
# `media-accel-rockchip` capability feature that provides HW transcode on RK35xx,
# and the `jellyfin-rockchip` glue that points one at the other. The same device
# and kernel as the rest of the RK1 family: this is turing-rk1/media-accel-forky
# plus the application layer and its configuration.
#
# Jellyfin installs from its signed upstream apt repository (keyring vendored
# at blobs/keyrings/jellyfin.gpg); see features/jellyfin/README.md. The sibling
# .lock holds the exact resolved pins; re-pin with `boot2deb update`.
device     = "turing-rk1"
kernel     = "rk3588-mainline-7.1"       # omit -> device default_kernel
suite      = "forky"                     # omit -> device default_suite
features   = ["jellyfin", "media-accel-rockchip", "jellyfin-rockchip"]
layout     = "combined"                  # omit -> device default_layout
image_size = "3G"                        # Jellyfin + media-accel over the base

# Where the media lives is deliberately not decided here. An RK1 running Jellyfin
# might keep its library on an M.2 disk, on an external USB drive, or on network
# storage, and root itself might be on the eMMC or on the NVMe — the recipe knows
# none of that. Declaring a disk here would bake one of those into the image and
# have first boot go looking for hardware the operator may not have.
#
# To attach one, add the `data-volume` feature and a `[[data_volumes]]` block to
# your own copy of this recipe; see docs/src/data-volumes.md.

# turing-rk1/media-accel-forky plus the application layer, and still under bring-up:
# the transcode path this recipe exists to serve has not been exercised through
# Jellyfin. Unchanged over the v7.1.6 kernel, which leaves the decode and encode
# drivers as they were — see turing-rk1/forky for the full delta.
[support]
status = "experimental"
date   = "2026-08-05"

# What an operator gets, stated up front, because the shape of the acceleration is
# not the shape the Jellyfin dashboard implies. The two limits underneath these ride
# in from the `media-accel-rockchip` feature and print alongside them.
caveats = [
  "Transcoding is hardware-*encode* only. The seeded /etc/jellyfin/encoding.xml selects the `rkmpp` acceleration type with an empty hardware-decoding codec list, so video is decoded and scaled on the CPU and encoded on the VEPU580. Re-enabling any codec under Playback > Transcoding > \"Enable hardware decoding for\" makes Jellyfin emit `-hwaccel rkmpp`, whose decoder cannot open on a mainline kernel, and those streams fail outright rather than falling back to software.",
  "Jellyfin's bundled FFmpeg is not installed — the recipe supplies /opt/ffmpeg-rk/bin/ffmpeg instead, which is the only build here that can reach the VEPU580. There is therefore no second encoder to fall back to if that path is changed to something invalid.",
]
