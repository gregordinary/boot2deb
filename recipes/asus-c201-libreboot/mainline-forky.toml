# recipes/asus-c201-libreboot/mainline-forky.toml — a libreboot'd ASUS Chromebook C201
# on a boot2deb-compiled mainline kernel.
#
# The two C201 opt-ins at once. From asus-c201-libreboot: the `speedy-libreboot` board
# profile and the 32 MiB kernel slot its firmware buffer needs, which puts the rootfs at
# 76 MiB rather than 44. From asus-c201/mainline-forky: a kernel compiled from mainline
# 7.1.y with the `rk3288-fixes` series, instead of Debian's own armhf kernel.
#
# The two opt-ins reinforce each other, which is why this pairing is worth its own
# recipe: the wider slot is headroom a *signed* payload can use, and a compiled kernel is
# the one whose payload you control — so this is the build point for a debug initramfs
# carrying the display stack, which a 16 MiB stock slot cannot hold.
#
# The image boots only on a unit running libreboot. Reach for `asus-c201/mainline-forky`
# on stock firmware; its stock profile boots on either.
device     = "asus-c201-libreboot"
kernel     = "rk3288-mainline-7.1"
suite      = "forky"
features   = []                # a base image, same surface as the other C201 recipes
layout     = "combined"

# The family's own size. The wider slots take 32 MiB more of it ahead of the rootfs, and
# first boot grows the partition to fill the card regardless.
image_size = "2G"

# Re-assessed over the v7.1.6 kernel; see asus-c201/mainline-forky for the delta.
# Nothing it moves is firmware-coupled, so the libreboot opt-in does not change it.
[support]
status = "expected"
date   = "2026-08-04"
