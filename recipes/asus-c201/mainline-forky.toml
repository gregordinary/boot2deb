# recipes/asus-c201/mainline-forky.toml — the C201 on a boot2deb-compiled kernel.
#
# Same board and suite as asus-c201/forky, but the kernel is compiled from
# mainline 7.2.y instead of installed from Debian: kconfig comes from the
# fragments (Debian-parity baseline + rk3288 slice) and the `rk3288-fixes`
# patch series rides on top. This is the customization seam — pick this recipe
# to change the kernel; pick asus-c201/forky to track Debian's.
device     = "asus-c201"
kernel     = "rk3288-mainline-7.2"
suite      = "forky"
features   = []                # a base image, same surface as asus-c201/forky
layout     = "combined"
image_size = "2G"

# `sudo` prompts for the account's own password on this image. A laptop leaves the desk,
# and an open session in someone else's hands should not be root as well.
# `asus-c201/forky` keeps the shipped `nopasswd` default.
sudo       = "password"

# The last pin that booted was v7.1.3, so this one has not been on the board. The pin is
# v7.2.8, the current stable point release. No 7.2.y point release touches an RK3288
# device tree or a defconfig. The drivers they do reach here, brcmfmac, the crypto hash
# engine and the eDP glue among them, take fixes only. Three things move from v7.1.7
# that this board reaches, and the `rk3288-fixes` series applies to all of it
# unchanged.
#
# `analogix_dp` — the eDP the panel hangs off — fixes a shift mismatch between the
# pre-emphasis and voltage-swing values it programs during link training. That is a
# fix on the one path between this board and a picture.
#
# The in-tree V4L2 RGA driver, which this recipe builds and the RK3588 recipes
# deliberately do not, takes the rework that carried RGA3 support into mainline. The
# RGA2 half is where this board sits, and it gains real behaviour: colorimetry is
# announced and synchronised rather than ignored, offsets are computed from the stride
# instead of the width, strides are aligned to four bytes, odd frame sizes are refused
# for YUV formats, and the scaling factor is range-checked. The hardware-specific parts
# move behind a struct and the command buffer is reused between jobs.
#
# `max98090` moves to the standard ASoC `set_jack` callback, and
# `rk3288-veyron-analog-audio.dtsi` drops `rockchip,hp-det-gpios` and
# `rockchip,mic-det-gpios`, neither of which the `rockchip,rockchip-audio-max98090`
# binding defines and neither of which any driver read.
#
# So the delta reads as favorable, but the claim is `expected` until an image from this
# pin boots.
[support]
status = "expected"
date   = "2026-08-21"
