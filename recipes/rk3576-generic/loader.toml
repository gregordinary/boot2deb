# recipes/rk3576-generic/loader.toml — the minimal maskrom/rockusb bring-up
# loader for any RK3576 board, as a u-boot-only deliverable. It is just DDR
# init + SPL + a u-boot that enters rockusb (loader) mode immediately — no
# display, no autoboot. Stream it into RAM over maskrom to bring up a blank
# board, then flash it over USB. The deliverable is the maskrom USB boot images
# from `--stage uboot`.
#
# It builds from the rk3576-generic control DTB, so the payload is identical on
# any RK3576 board — hence it is homed on the rk3576-generic tool host, not a
# specific board. Being a pure bootloader unrelated to any Debian release, it
# names no suite, kernel, or image — only the u-boot profile.
device        = "rk3576-generic"
deliverable   = "uboot"
uboot_profile = "rk3576-loader"

# A blank-board bring-up loader; the deliverable is the u-boot USB boot images, not
# a flashed rootfs. Not built or exercised on hardware yet, so "expected".
[support]
status = "expected"
date   = "2026-07-21"
