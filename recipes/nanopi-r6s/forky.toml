# recipes/nanopi-r6s/forky.toml — the NanoPi R6S base image on Debian forky.
# A minimal image: Debian's standard userland, no feature, and the
# rk3588-mainline-7.3 kernel with the rk3588-accel series and the accel/full kconfig.
# The video, RGA and NPU drivers are in the kernel and the Rockchip media userspace is
# not in the image.
#
# The BL31 is Trusted Firmware-A, built from the SoC layer's [tfa] source, in place
# of rkbin's prebuilt one. The DDR init stays rkbin's.
# Constraints only; the exact resolution is written to the sibling .lock.
device     = "nanopi-r6s"
kernel     = "rk3588-mainline-7.3"       # omit -> device default_kernel
suite      = "forky"                     # omit -> device default_suite
features   = []
layout     = "combined"                  # omit -> device default_layout
bl31       = "tfa"                       # omit -> device default_bl31 (rkbin)
image_size = "2G"

# The pin is v7.3.4, the series' floor: 7.3.4 removes the gen_pool_destroy() call from
# rkvdec's probe error path, a borrowed SRAM pool the driver never owned, and 044 is
# written against that function without it. On this image's other paths 7.3.4 fixes
# allocation leaks in the AV1 decoder's init, disables hantro's runtime PM before its
# teardown, guards hantro's MPEG-2 controls against a missing one, and gives an HEVC SPS
# control a 4:2:0 default. It also removes the sata_inic162x driver, which the base
# kconfig fragment no longer names.
#
# u-boot v2026.10 builds from the board's own defconfig with one SoC patch, the RK3588
# SPL clock fix, which sets SPLL on an eMMC boot as well. TF-A is v2.16-rc0, the
# first tag with the RK3588 CVE-2025-10263 workaround, built from source in the cross
# root.
#
# `experimental` until an image from this pin boots on the board: nothing has, on either
# BL31.
[support]
status = "experimental"
date   = "2026-11-21"
