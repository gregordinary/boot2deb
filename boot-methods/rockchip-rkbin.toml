# boot-methods/rockchip-rkbin.toml — Rockchip idbloader + u-boot.itb written to
# the raw gap ahead of the rootfs partition, with an rkbin DDR TPL and the selected
# BL31 (rkbin's, or Trusted Firmware-A built from source).
description = "Rockchip idbloader + u-boot.itb in the raw gap (rkbin DDR TPL, selected BL31)"

# u-boot's canonical upstream, run by the project itself. `github.com/u-boot/u-boot`
# is a mirror containing byte-identical tag objects, so `--uboot-src` reaches the same
# tree if this host is unreachable.
uboot_source = "https://git.u-boot-project.org/u-boot/u-boot.git"
uboot_ref    = "v2026.10"                # default constraint; pinned exactly in the lock

# The `patches` repo the selected u-boot series' series is fetched from and pinned
# against (the u-boot analogue of a kernel definition's `patches_url`). Read only when
# a device on this method selects a real u-boot series; a board whose u-boot ships
# pristine never touches it.
patches_url  = "https://github.com/gregordinary/patches.git"
patches_ref  = "main"                    # default constraint; the exact commit is pinned in the lock

# Raw-gap layout (byte offsets, outside any filesystem):
#   idbloader   @ 32 KiB
#   u-boot.itb  @ 8 MiB
#   seed partition in the MiB below the partition offset
#   partitions start @ 16 MiB: the EFI system partition under the efi loader, then the
#   rootfs; the rootfs alone under extlinux
idbloader_offset = "32KiB"
uboot_itb_offset = "8MiB"
partition_offset = "16MiB"

# u-boot reads an extlinux menu and is a UEFI implementation, so a board on this method
# boots either way (loaders/<loader>.toml). extlinux is the default: u-boot reads the
# menu straight off the rootfs, with no partition of its own.
loaders        = ["extlinux", "efi"]
default_loader = "extlinux"

# The kernel and initrd either loader starts, which the kernel package and the
# initramfs generator leave on /boot. Boards on this method have booted with them
# missing and said nothing until the bootloader shrugged, so the selftest asserts each.
# What each loader adds (its menu, the DTB where its firmware reads it) is checked by
# the loader's own layer and by the build.
[[expect]]
check = "file"
path  = "/boot/vmlinuz-*"

[[expect]]
check = "file"
path  = "/boot/initrd.img-*"
