# devices/h96-max-m9-npu.toml -- H96 MAX M9 (RK3576), NPU-enabled experimental variant.
#
# The base board plus the RK3576 NPU (rocket) enable and nothing else: the diff from
# the production image is exactly the NPU, which is what a reverse-engineering image
# wants. It needs its own device because the NPU enable rides a board `.dtsi`, and
# device_dts is a device-layer field.
#
# EXPERIMENTAL. Binding the rocket driver exposes the accel uAPI (/dev/accel) for
# register probing and job submission; the RK3576 compute datapath does not yet run
# inference correctly, so this is a bring-up image, not a working accelerator. See the
# rk3576-npu patch profile in the patches repo.
#
# Everything not restated below is inherited: the SoC and boot method, the u-boot
# defconfig and profiles, the cmdline, the board packages, the kernel axis, the image
# size, the rkbin chain, and the AIC8800 device_kmods opt-in. The base
# board's `overlay/` tree comes too -- its Wi-Fi regulatory and debug-level
# modprobe.d, Bluetooth attach unit, IR keymap, and CEC units all reach this image,
# and a file placed at devices/h96-max-m9-npu/overlay/<same path> would override one.
extends                 = "h96-max-m9"

description             = "H96 MAX M9 (RK3576) TV box -- NPU experimental"
hostname                = "h96-max-m9-npu"

# NPU-enabled DTB: rk3576-h96-max-m9-npu.dts #includes the base board and adds the NPU
# enable. Arrays replace rather than append across the `extends` merge, so the base
# board's own source is restated here -- both are listed so the #include resolves
# in-tree, and the wrapper builds the DTB this device boots.
kernel_dtb              = "rockchip/rk3576-h96-max-m9-npu.dtb"
device_dts              = [
    "devices/h96-max-m9/dts/rk3576-h96-max-m9.dts",
    "devices/h96-max-m9-npu/dts/rk3576-h96-max-m9-npu.dts",
]

# The base board's fragment (restated, per the array rule above) plus the NPU
# enablement one (CONFIG_DRM_ACCEL_ROCKET + ROCKCHIP_IOMMU).
device_config_fragments = ["device/h96-max-m9", "accel/rk3576-npu"]

# The RK3576 NPU (rocket) kernel series, applied after the kernel's SoC-wide
# rk3576-fixes profile. Board-opt-in, so it lives on the device, not the kernel.
device_patch_profiles   = ["rk3576-npu"]
