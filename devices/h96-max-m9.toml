# devices/h96-max-m9.toml — H96 MAX M9 / M9S (RK3576) TV box.
# Hardware invariants + defaults; a device states only its deltas.
description             = "H96 MAX M9 (RK3576) TV box"
soc                     = "rk3576"                 # -> arch, dt_dir, modules, rkbin
boot_method             = "rockchip-rkbin"         # default within supported_boot_methods
supported_boot_methods  = ["rockchip-rkbin"]

# Validated against u-boot v2026.04: builds idbloader.img + u-boot.itb.
uboot_defconfig         = "generic-rk3576_defconfig"

# The board DTS is not upstream, so the kernel builds this DTB from the
# device_dts source below rather than from its own tree (PROJECT-PLAN §4).
# Resolution checks that the two names agree.
kernel_dtb              = "rockchip/rk3576-h96-max-m9.dtb"
device_dts              = ["devices/h96-max-m9/dts/rk3576-h96-max-m9.dts"]

# Boot-time workarounds this board needs (mk_extlinux appends them after root=):
#  - cpuidle.off=1: a CPU suspended into the DT CPU_SLEEP state can miss its
#    wakeup (BL31-side; the checker self-test is already off in the SoC kconfig
#    fragment, this covers normal governor-driven idle). Drop once BL31 delivers
#    core-off wakeups reliably.
#
# The display no longer needs a workaround. The u-boot VOP2 driver quiesces the
# controller at OS handoff, so the kernel inherits a resettable VOP and drives
# HDMI itself: console, EDID, and mode list all come up. Any build whose u-boot
# lights the panel without that teardown needs
# "drm_kms_helper.fbdev_emulation=0 video=HDMI-A-1:d" back, or the kernel loses
# the display entirely -- see the display reference, section 5.
kernel_cmdline          = "cpuidle.off=1"

# Board IR + regdb kconfig deltas, plus the NPU enable (DRM_ACCEL + ROCKCHIP_IOMMU
# + the rocket driver). The NPU is board opt-in rather than SoC-wide because the
# enable rides this board's `.dts` and its rail.
device_config_fragments = ["device/h96-max-m9", "accel/rk3576-npu"]

# The RK3576 NPU (rocket) kernel series, composed after the kernel's SoC-wide
# rk3576-fixes series. On the device rather than the kernel so an RK3576 board
# without an NPU enable in its device tree carries neither the series nor the driver.
# It delivers a device (/dev/accel) that computes bit-exact; no released userspace
# encodes for this SoC yet, so nothing in the image opens it.
device_patch_series   = ["rk3576-npu"]

# The board's AIC8800D80 SDIO Wi-Fi driver, built out-of-tree from kmods/aic8800.toml
# rather than carried as an in-tree patch series. Board opt-in, so the shared RK3576
# kernel stays lean for boards without the chip.
device_kmods            = ["aic8800"]

# Board userspace, kept on the device layer so the rk3576-evb1-v10 validator (no
# combo Wi-Fi/BT, no IR handset) does not carry any of it:
#  - bluez + gpiod: the AIC8800D80's BT is UART HCI on ttyS4 (see the DTS &uart4 node
#    and aic8800-bluetooth.service); bluez provides the hciattach/bluetoothctl and
#    gpiod's gpioset drives the BT_REG_ON / HST_WAK_BT wake lines.
#  - ir-keytable: loads the recovered NEC keymap onto the gpio-ir-receiver rc device
#    (ir-keymap-h96.service + overlay/etc/rc_keymaps/h96.toml) so the bundled IR
#    handset produces input events.
#  - v4l-utils: cec-ctl / cec-follower for the HDMI-CEC units (box drives the TV, or
#    the TV remote drives the box). The units ship disabled -- opt-in via systemctl.
#  - libgl1-mesa-dri / libegl-mesa0 / libgbm1: the GPU's userspace. The Mali-G52 is
#    driven by mainline panfrost, whose userspace is Mesa -- no vendor blob, unlike
#    the RK3588's G610, which is CSF and takes libmali. libgl1-mesa-dri carries
#    panfrost_dri.so (the driver proper), libegl-mesa0 the EGL vendor library
#    including the GBM platform, and libgbm1 the buffer manager a KMS client
#    allocates from. Without these the render node exists with nothing able to open
#    it. On the device layer rather than the SoC layer for the same reason as the
#    rest of this list: the rk3576-evb1-v10 validator has no use for a GL stack.
packages                = [
    "bluez",
    "gpiod",
    "ir-keytable",
    "v4l-utils",
    "libgl1-mesa-dri",
    "libegl-mesa0",
    "libgbm1",
]

supported_kernels       = ["rk3576-mainline-7.1"]
default_kernel          = "rk3576-mainline-7.1"
# The u-boot variant is its own axis. This board uses the SoC-generic display
# u-boot for its shipped image (rk3576-display), and a board-specific util tool
# that adds this board's ethernet (h96-max-m9-util, a u-boot-only recipe). The
# board-neutral loader and util tools are homed on the rk3576-generic device.
supported_uboot_series = ["rk3576-display", "h96-max-m9-util"]
default_uboot_series    = "rk3576-display"
default_suite           = "forky"
default_layout          = "combined"               # combined | split
hostname                = "h96-max-m9"
image_size              = "2G"

# rkbin (ATF + DDR TPL; no BL32) is inherited from socs/rk3576.toml. The H96
# carries LPDDR4X at 2112 MHz, which is the SoC default loader's native target, so
# this board overrides no blobs.
