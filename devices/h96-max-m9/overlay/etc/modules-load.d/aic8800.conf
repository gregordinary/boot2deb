# AIC8800 SDIO Wi-Fi. The BSP layer powers the chip and downloads its firmware; the
# FullMAC driver registers the cfg80211 device on top and depends on the BSP's
# exported symbols, so the BSP loads first. SDIO coldplug would autoload both via
# their MODULE_DEVICE_TABLE once the firmware is in place, but naming them here is
# deterministic regardless of probe timing.
aic8800_bsp
aic8800_fdrv
