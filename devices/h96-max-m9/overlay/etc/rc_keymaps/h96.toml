# H96 MAX M9 -- IR remote keymap for rc-core / ir-keytable.
#
# Recovered from the vendor Android device tree's rockchip,usercode /
# rockchip,key_table nodes (the out-of-tree pwm-remotectl driver has no mainline
# equivalent). The board's IR receiver is a plain GPIO (GPIO0_C4) decoded by
# gpio-ir-receiver + the rc-core NEC decoder; this maps the decoded scancodes to
# input keycodes. The vendor shipped six remote variants (six usercodes); their
# NEC addresses differ, so every variant is listed and only the matching handset's
# scancodes ever fire. A live `ir-keytable -t` press confirms the variant and the
# byte orientation; adjust here if a press decodes to the bit-reverse of a listed
# scancode. The vendor maps the centre/OK button to KEY_REPLY (its Android keylayout
# retranslated it); change those entries to KEY_OK/KEY_ENTER if a frontend expects it.
[[protocols]]
name = "h96-uc4040"
protocol = "necx"
[protocols.scancodes]
0x4040f2 = "KEY_REPLY"
0x4040ba = "KEY_BACK"
0x4040f4 = "KEY_UP"
0x4040f1 = "KEY_DOWN"
0x4040ef = "KEY_LEFT"
0x4040ee = "KEY_RIGHT"
0x4040bd = "KEY_HOME"
0x4040ea = "KEY_VOLUMEUP"
0x4040e3 = "KEY_VOLUMEDOWN"
0x4040e2 = "KEY_SEARCH"
0x4040b2 = "KEY_POWER"
0x4040bc = "KEY_MUTE"
0x4040ec = "KEY_MENU"
0x4040bf = "KEY_YELLOW"
0x4040e0 = "KEY_BLUE"
0x4040e1 = "KEY_CHANNELUP"
0x4040e9 = "KEY_F13"
0x4040e6 = "KEY_MICMUTE"
0x4040e8 = "KEY_F15"
0x4040e7 = "KEY_F16"
0x4040f0 = "KEY_TEXT"
0x4040be = "KEY_MODE"

