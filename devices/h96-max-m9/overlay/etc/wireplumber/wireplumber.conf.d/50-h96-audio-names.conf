# Distinct names for the board's three audio sinks.
#
# All three are `simple-audio-card` devices with no ALSA UCM profile, so
# WirePlumber builds each one from its generic `stereo-fallback` profile and
# gives all of them the same `node.description`, "Built-in Audio Stereo". A
# desktop volume menu then lists three indistinguishable outputs. The ALSA card
# names are already distinct, so the fix is to carry them through to the
# description the desktop shows.
#
# Keyed on `node.name` rather than `alsa.card_name` because node.name is what
# WirePlumber derives from the DT node label (`analog-sound`, `hdmi-sound`,
# `spdif-sound`), and those labels are fixed by this board's `.dts`.

monitor.alsa.rules = [
  {
    matches = [ { node.name = "alsa_output.platform-analog-sound.stereo-fallback" } ]
    actions = {
      update-props = {
        node.description = "Analog 3.5 mm Jack"
        node.nick        = "Analog"
      }
    }
  }
  {
    matches = [ { node.name = "alsa_output.platform-hdmi-sound.stereo-fallback" } ]
    actions = {
      update-props = {
        node.description = "HDMI Audio"
        node.nick        = "HDMI"
      }
    }
  }
  {
    matches = [ { node.name = "alsa_output.platform-spdif-sound.stereo-fallback" } ]
    actions = {
      update-props = {
        node.description = "S/PDIF Optical Out"
        node.nick        = "S/PDIF"
      }
    }
  }
]
