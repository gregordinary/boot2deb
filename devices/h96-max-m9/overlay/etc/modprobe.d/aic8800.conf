# The AIC8800 FullMAC driver defaults to a self-managed regulatory domain
# (custregd=1): it flags its wiphy REGULATORY_WIPHY_SELF_MANAGED and applies an
# internal domain keyed by a country code that defaults to the world domain, which
# leaves the 5 GHz band disabled and ignores the system regulatory settings. custregd=0
# makes the driver defer to the standard cfg80211 regulatory path instead, so the
# loaded regulatory database and the ieee80211_regdom country (see cfg80211.conf) take
# effect and the 5 GHz channels enable.
#
# The debug level is not set here. Both modules compile in LOGERROR as their default
# (the aic8800-quiet-log-level kmod patch), so quietness travels with the module rather
# than depending on this file reaching the image. aicwf_dbg_level is still a
# module_param on the FullMAC driver, so add `aicwf_dbg_level=0x40f` to the line below
# to debug the driver -- that re-enables info/debug/trace plus the firmware log.
options aic8800_fdrv custregd=0
