# Set the wireless regulatory domain at cfg80211 load time. The AIC8800 radio's
# 5 GHz band is disabled under the world domain "00"; a country must be selected for
# those channels to enable. This pairs with CONFIG_CFG80211_REQUIRE_SIGNED_REGDB
# being unset (see fragments/device/h96-max-m9.config), which lets the regulatory
# database load so these rules can apply. Change US to the operating country as
# needed (two-letter ISO 3166-1 code).
options cfg80211 ieee80211_regdom=US
