# Suspend this board to idle, never to deep.
#
# RK3576 does not come back from the deep (S3) path: the box powers down and no
# wake source brings it up, so it needs the power removed. Suspend-to-idle does
# resume, and the remote's POWER key wakes it through gpio0 PD3. mem_sleep still
# reports "s2idle [deep]" with deep selected, so systemd's default of writing
# "mem" would take the broken path -- name the working state explicitly.
[Sleep]
SuspendState=freeze
