# The remote's POWER key suspends this box, and the same key wakes it.
#
# systemd's own default is HandlePowerKey=poweroff, which is a one-way trip on this
# hardware: the box has no power button, and the remote's receiver is unpowered once
# the box is off, so nothing can turn it back on short of cycling the supply. Suspend
# is recoverable -- the receiver drives gpio0 PD3, the gpio-keys POWER input, which is
# a wakeup-source in the always-on power domain and comes back from s2idle.
#
# Pair with 50-h96-s2idle.conf, which pins the sleep state to freeze: the deep path
# this SoC would otherwise select does not resume at all.
#
# This is the shipped default, not a mandate. It sits in /usr/lib so a file of the same
# name in /etc/systemd/logind.conf.d/ replaces it wholesale -- see
# /usr/lib/h96/power-profiles/README for the poweroff and ignore alternatives.
[Login]
HandlePowerKey=suspend
