# distros/debian.toml — the Debian archive: where its suites are served from, how a
# release is verified, and what a Debian image adds to the shared base set.
#
# A recipe never names this file. It names a suite, and resolution finds the one
# distro layer whose `suites` list contains it.

description = "Debian"

# The codenames and symbolic names this layer's archive facts hold for. Resolution
# refuses a suite that two distro layers list, and one that no layer lists, so a new
# release is one line here.
suites = [
    "bookworm",
    "trixie",
    "forky",
    "sid",
    "oldstable",
    "stable",
    "testing",
    "unstable",
]

# Suites that publish their release pocket and nothing else. Unstable is where fixes
# land directly, so the archive serves no -updates or -security pocket for it.
rolling = ["sid", "unstable"]

# The archive serving each suite's release pocket. Plain http is standard Debian
# practice: apt verifies every Release signature against the archive keyring, so the
# transport has no integrity burden.
mirror = "http://deb.debian.org/debian"
# The point-in-time copy of that archive. A captured snapshot timestamp is appended to
# it, as `<snapshot>/<timestamp>/`.
snapshot = "https://snapshot.debian.org/archive/debian"

# non-free and non-free-firmware contain the codecs and the NIC and GPU firmware the
# boards need. contrib rounds out the standard set.
components = ["main", "contrib", "non-free", "non-free-firmware"]
# The components a Linux-libre image resolves against and offers on the board.
free_components = ["main"]

# Verifies each Release signature during the build. A file name under
# `blobs/keyrings/`, held to its fingerprint manifest there.
keyring = "debian-archive-keyring.gpg"
# The keyring the image's apt sources name in `Signed-By`. The debian-archive-keyring
# package installs it and keeps it current as the archive rotates keys.
image_keyring = "/usr/share/keyrings/debian-archive-keyring.gpg"

# The account every Debian image is created with.
default_user = "debian"

# The initramfs generator Debian's kernels expect. A recipe may pick the other one.
initramfs_generator = "initramfs-tools"

# Joined to the base set in base.toml. Only what differs between distributions lives
# here.
packages = [
    # A light DHCP client, which brings the board onto the network before anyone has
    # logged in.
    "dhcpcd",
    # SNTP from systemd. The base layer's `ntp_servers` configure it.
    "systemd-timesyncd",
]
# The DHCP client Debian's important set would otherwise install beside dhcpcd.
exclude = ["isc-dhcp-client"]

# The pockets beside the release one, in the order the image's apt sources list them.
# A build resolves against every one of them, so an image ships the fixes published
# since its release rather than the release as it froze. A pocket without its own
# `mirror` or `snapshot` is served by the release pocket's.
[[pockets]]
suffix = "-updates"

# Debian serves security updates from an archive of their own.
[[pockets]]
suffix = "-security"
mirror = "http://deb.debian.org/debian-security"
snapshot = "https://snapshot.debian.org/archive/debian-security"
