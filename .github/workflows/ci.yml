name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

# Nothing here writes to the repo.
permissions:
  contents: read

# Superseded runs on the same ref are pointless; drop them.
concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Split out because it needs no compile: it fails in seconds rather than after
  # a full build. `rustfmt.toml` pins `style_edition`, so the runner's rustfmt
  # agrees with a local one without pinning the toolchain itself.
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: cargo fmt --all --check

  # Tests, clippy, and rustdoc share one job so they share a target directory; a
  # second job would pay the same compile twice for no extra signal.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      # Engine tests that shell out to an absent host tool skip themselves rather
      # than fail, so an unavailable dependency silently costs coverage. The tools
      # they exercise (git, tar, xz, openssl, e2fsprogs, util-linux) are already on
      # the image, so nothing is installed here — and nothing needs to be for the
      # packaging tests either, since the `dpkg` those use comes from a root the test
      # provisions rather than from the runner.
      #
      # `BOOT2DEB_REQUIRE_HOST_TOOLS` turns a self-skip into a panic. The end-to-end
      # tests skip themselves on a dev host that lacks a prerequisite; this runner has
      # all of them — the tools above, unprivileged user namespaces, and a reachable
      # Debian mirror for the packaging root — and therefore claims they are present,
      # so a skip here is a coverage regression (a changed runner image, a network
      # policy) and must fail rather than pass quietly. It has happened before.
      - name: Run tests
        run: cargo test --workspace
        env:
          BOOT2DEB_REQUIRE_HOST_TOOLS: "1"
      # The SBOM's correctness is partly a claim about two *external* specifications,
      # and no amount of Rust typing checks that: a misspelled key or a value outside an
      # enum produces a document that compiles, serializes, and is rejected by every
      # consumer. The integration test above renders both formats from the shipped RK1
      # configuration into `target/sbom/`; this validates them against the published
      # schemas. Fetched rather than vendored, because the question is whether the
      # output conforms to the specification as it stands, not to a copy of it.
      - name: Validate the SBOM documents against the published schemas
        # `pipx run` rather than `pip install`: the runner's system Python is
        # externally managed (PEP 668), which refuses a plain install.
        run: |
          pipx run check-jsonschema \
            --schemafile https://raw.githubusercontent.com/spdx/spdx-spec/support/2.3/schemas/spdx-schema.json \
            target/sbom/spdx.json
          pipx run check-jsonschema \
            --schemafile https://raw.githubusercontent.com/CycloneDX/specification/1.6/schema/bom-1.6.schema.json \
            target/sbom/cyclonedx.json
      # `--all-targets` so test and example code is linted too, not just the libs.
      # The toolchain is not pinned, so a new stable can add a lint and fail this on
      # an unrelated change; fix the lint or add a scoped `#[allow]` with a reason.
      - name: Lint, warning-clean
        run: cargo clippy --workspace --all-targets -- -D warnings
      # `core` and `engine` carry `#![warn(missing_docs)]`; denying warnings here
      # is what makes an undocumented public item, or a broken intra-doc link, a
      # build failure instead of a note nobody reads.
      - name: Build the docs, warning-clean
        run: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: "-D warnings"

  # An MSRV nobody builds is a guess. `rust-version` in the workspace manifest is a
  # promise to anyone on an older toolchain; this job is what keeps it true, failing
  # as soon as a newer language or library feature slips in. The floor is read back
  # out of Cargo.toml rather than repeated here, so the gate cannot drift from the
  # claim it enforces. `--all-targets` because the floor covers test code too.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the declared MSRV toolchain
        run: |
          msrv="$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)"
          echo "Declared MSRV: $msrv"
          echo "MSRV=$msrv" >> "$GITHUB_ENV"
          rustup toolchain install "$msrv" --profile minimal --no-self-update
      - name: Build at the MSRV floor
        run: cargo "+$MSRV" check --workspace --all-targets

  # The dependency half of the gate: a RustSec advisory against any crate in
  # `Cargo.lock` fails here, so a new one arrives as a red build rather than as
  # something nobody ran `cargo audit` to find. Which advisories are *accepted*, and the
  # reachability argument for each, live in `.cargo/audit.toml` — checked in, so the
  # reasoning is reviewed alongside the code instead of being typed into a workflow
  # input where no one reads it.
  #
  # It needs no compile, only the lockfile, so it runs beside `fmt` rather than in the
  # build job — and it does not share that job's cache, whose key is the lockfile hash:
  # advisories are published against a lockfile that did not change, which is exactly
  # the case a hit-on-unchanged-input cache would hide.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Building cargo-audit is most of this job's wall clock and it changes only when
      # its own version does; the advisory database is fetched fresh at run time either
      # way, so caching the binary cannot stale the result.
      - name: Cache the cargo-audit binary
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit
      - name: Audit the dependency tree
        run: cargo audit
