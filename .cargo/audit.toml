# `cargo audit` configuration — the dependency half of the CI gate.
#
# Every advisory against a crate in `Cargo.lock` fails the build unless it is listed
# here with the reasoning that made it acceptable. An entry is a claim about *this*
# tree's call paths, not a blanket dismissal, and it is removed the moment a fixed
# version exists.

[advisories]
ignore = [
    # RUSTSEC-2023-0071 — "Marvin Attack: potential key recovery through timing
    # sidechannels" in `rsa`, reached directly from `boot2deb-engine`.
    #
    # Not reachable as a vulnerability here. The attack recovers an RSA *private* key
    # from the timing of operations performed by the key's holder, as measured by a
    # party that can choose inputs and observe the response time. boot2deb's one use of
    # `rsa` is `press --fresh-identity`, which re-signs a depthcharge kernel (engine
    # `image::vboot`) with the private key the image itself carries for its on-device
    # kernel upgrades. On every boot2deb image that is the vboot developer key, published
    # test material that Debian ships in `vboot-kernel-utils`, so there is no secret to
    # recover. The signing runs locally, twice per press, with no party choosing inputs
    # or timing it. Archive signatures are verified by `irongall`, which shares no code
    # with `rsa`.
    #
    # Nor is there a version to move to. The advisory carries no patched release, and
    # the 0.10 line is still a release candidate whose own README states that the crate
    # is vulnerable to the Marvin Attack.
    #
    # Drop this entry when `rsa` ships a constant-time release and the engine's
    # requirement moves to it.
    "RUSTSEC-2023-0071",
]
